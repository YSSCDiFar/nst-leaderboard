<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>NEURONSTRIKE // GHOSTSTEEL SHOT REPLAY</title>
    <!-- 戰術電競字體 -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:ital,wght@0,600;0,700;1,700&family=Orbitron:wght@700;900&family=Share+Tech+Mono&display=swap" rel="stylesheet">
    
    <!-- html2canvas 截圖引擎 -->
    <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>

    <style>
        :root {
            --bg-deep: #030508;
            --panel-bg: #06090e;
            --cyan-core: #00d8e6;
            --cyan-glow: rgba(0, 216, 230, 0.35);
            --neon-green: #00e65c;
            --neon-gold: #e6a800;
            --gold-glow: rgba(230, 168, 0, 0.4);
            --neon-red: #e62237;
            --text-dim: #506477;
            --tac-black: #05080c;
            --tac-plate: #0c1219;
            --tac-border: #141f2b;

            /* 實時動態燈條顏色 */
            --strip-color: transparent;
            --strip-opacity: 0;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background-color: #010204;
            color: #dce7f2;
            font-family: 'Share Tech Mono', monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 10px 8px;
            min-height: 100vh;
        }

        /* 戰術 9:16 IG 限動畫布容器 */
        .story-wrapper {
            width: 360px;
            height: 640px;
            background: radial-gradient(circle at 50% 20%, #070c12 0%, #020406 85%);
            border: 1px solid #162433;
            border-radius: 8px;
            padding: 18px 16px 14px 16px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            position: relative;
            overflow: hidden;
            box-shadow: 0 0 40px rgba(0, 0, 0, 0.95);
        }

        .header-brand {
            border-bottom: 1px solid #101a24;
            padding-bottom: 6px;
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            z-index: 10;
        }

        .brand-title {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.05rem;
            color: var(--cyan-core);
            letter-spacing: 2px;
            text-shadow: 0 0 10px var(--cyan-glow);
        }

        .brand-sub { font-size: 0.58rem; color: var(--text-dim); letter-spacing: 1px; }

        .live-tag {
            font-size: 0.65rem;
            color: var(--neon-gold);
            font-weight: bold;
            display: flex;
            align-items: center;
            gap: 5px;
        }
        .live-dot {
            width: 6px;
            height: 6px;
            background: var(--neon-gold);
            border-radius: 50%;
            animation: pulseDot 0.8s infinite alternate;
        }
        @keyframes pulseDot {
            from { opacity: 0.3; transform: scale(0.8); }
            to { opacity: 1; transform: scale(1.2); box-shadow: 0 0 8px var(--neon-gold); }
        }

        .hero-section {
            margin: 6px 0 2px 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 10;
        }

        .operator-tag .lbl { font-size: 0.55rem; color: var(--text-dim); letter-spacing: 1.5px; }
        .operator-tag .name {
            font-family: 'Chakra Petch', sans-serif;
            font-weight: 700;
            font-size: 1.25rem;
            color: #fff;
            letter-spacing: 1px;
        }

        /* 特戰鋼印評級徽章 */
        .grade-badge {
            text-align: center;
            background: #090e14;
            border: 2px solid var(--neon-gold);
            padding: 2px 10px;
            border-radius: 4px;
            box-shadow: 0 0 12px var(--gold-glow), inset 0 0 6px rgba(230, 168, 0, 0.2);
            transform: rotate(-3deg);
            max-width: 115px;
            overflow: hidden;
        }

        .grade-badge .grade {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.05rem;
            font-weight: 900;
            color: var(--neon-gold);
            letter-spacing: 1px;
            white-space: nowrap;
            line-height: 1.2;
        }

        .score-display {
            background: #04070a;
            border: 1px solid #101a24;
            border-radius: 6px;
            padding: 8px 10px;
            text-align: center;
            z-index: 10;
        }

        .score-lbl { font-size: 0.55rem; color: var(--text-dim); letter-spacing: 2px; }

        .score-val {
            font-family: 'Orbitron', monospace;
            font-size: 2.6rem;
            font-weight: 900;
            color: var(--cyan-core);
            text-shadow: 0 0 20px var(--cyan-glow);
            line-height: 1;
            margin: 3px 0;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 6px;
            margin-top: 4px;
        }

        .stat-card {
            background: #06090d;
            border: 1px solid #0f1822;
            padding: 5px 2px;
            border-radius: 4px;
            text-align: center;
        }

        .stat-card .lbl { font-size: 0.5rem; color: var(--text-dim); }
        .stat-card .val { font-family: 'Orbitron', monospace; font-size: 0.8rem; font-weight: bold; color: #fff; margin-top: 2px; }

        /* ─── 鋼靶與光纖燈條容器 ─── */
        .target-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            margin: 36px 0 8px 0;
            position: relative;
            z-index: 10;
        }

        .tac-steel-target {
            width: 190px;
            height: 245px;
            background: var(--tac-black);
            border: 2px solid var(--tac-border);
            border-radius: 0 0 8px 8px;
            position: relative;
            box-shadow: inset 0 0 20px rgba(0,0,0,0.95);
        }

        /* 軀幹外沿燈條 */
        .led-edge-strip {
            position: absolute;
            inset: -4px;
            border-radius: 0 0 12px 12px;
            pointer-events: none;
            box-shadow: 0 0 18px var(--strip-color), inset 0 0 6px var(--strip-color);
            opacity: var(--strip-opacity);
            transition: opacity 0.08s ease, box-shadow 0.08s ease;
            z-index: 1;
        }

        .target-head {
            width: 72px;
            height: 50px;
            background: var(--tac-black);
            border: 2px solid var(--tac-border);
            border-bottom: none;
            border-radius: 12px 12px 0 0;
            position: absolute;
            top: -48px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 2;
        }

        /* 頭部外沿燈條 */
        .head-led-strip {
            position: absolute;
            inset: -4px;
            border-radius: 14px 14px 0 0;
            pointer-events: none;
            box-shadow: 0 0 18px var(--strip-color), inset 0 0 6px var(--strip-color);
            opacity: var(--strip-opacity);
            transition: opacity 0.08s ease, box-shadow 0.08s ease;
        }

        .top-hang-hole {
            position: absolute;
            top: 5px;
            left: 50%;
            transform: translateX(-50%);
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: #000;
            border: 1px solid #334455;
        }

        .shoulder-line-l, .shoulder-line-r {
            position: absolute;
            top: 6px;
            width: 2px;
            height: 18px;
            background: var(--tac-border);
        }
        .shoulder-line-l { left: 44px; transform: rotate(-35deg); }
        .shoulder-line-r { right: 44px; transform: rotate(35deg); }

        /* 1~8 號活動鋼板樣式 */
        .tac-plate {
            background: var(--tac-plate);
            border: 1px solid #1d3345;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Share Tech Mono', sans-serif;
            font-weight: 700;
            color: #556c82;
            position: absolute;
            z-index: 3;
            overflow: visible;
            transition: background 0.1s ease, box-shadow 0.1s ease, transform 0.1s ease;
        }

        #plt-2 { width: 36px; height: 36px; border-radius: 50%; top: 8px; left: 50%; transform: translateX(-50%); font-size: 0.85rem; }
        #plt-3 { width: 60px; height: 20px; border-radius: 3px; top: 15px; left: 50%; transform: translateX(-50%); font-size: 0.8rem; }
        #plt-1 { width: 62px; height: 62px; border-radius: 50%; top: 48px; left: 50%; transform: translateX(-50%); font-size: 1.25rem; border-color: #594719; color: #bfa048; }
        #plt-4 { width: 28px; height: 82px; border-radius: 3px; top: 40px; left: 8px; font-size: 0.85rem; }
        #plt-5 { width: 28px; height: 82px; border-radius: 3px; top: 40px; right: 8px; font-size: 0.85rem; }
        #plt-6 { width: 34px; height: 46px; border-radius: 3px; top: 162px; left: 18px; font-size: 0.85rem; }
        #plt-7 { width: 38px; height: 50px; border-radius: 3px; top: 170px; left: 50%; transform: translateX(-50%); font-size: 0.95rem; }
        #plt-8 { width: 34px; height: 46px; border-radius: 3px; top: 162px; right: 18px; font-size: 0.85rem; }

        /* 鋼板受彈瞬發高光 */
        .plate-flash-a { background: var(--neon-red) !important; color: #fff !important; box-shadow: 0 0 25px var(--neon-red) !important; transform: scale(1.15) !important; }
        #plt-2.plate-flash-a { transform: translateX(-50%) scale(1.15) !important; }
        .plate-flash-b { background: var(--neon-gold) !important; color: #000 !important; box-shadow: 0 0 25px var(--neon-gold) !important; transform: scale(1.12) !important; }
        #plt-1.plate-flash-b { transform: translateX(-50%) scale(1.12) !important; }
        .plate-flash-c { background: var(--neon-green) !important; color: #000 !important; box-shadow: 0 0 25px var(--neon-green) !important; transform: scale(1.12) !important; }

        /* 彈著孔（依射速烙印彈出） */
        .bullet-hole {
            position: absolute;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #d4ffea;
            box-shadow: 0 0 8px var(--neon-green), inset 0 0 2px #000;
            border: 1px solid var(--neon-green);
            transform: translate(-50%, -50%) scale(0);
            z-index: 25;
            pointer-events: none;
            transition: transform 0.15s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        .bullet-hole.popped { transform: translate(-50%, -50%) scale(1); }

        .bullet-hole.charlie-hole {
            background: #d8f7ff;
            box-shadow: 0 0 8px var(--cyan-core), inset 0 0 2px #000;
            border-color: var(--cyan-core);
        }

        .brand-pedestal {
            margin-top: 14px;
            padding: 4px 12px;
            background: #05080c;
            border: 1px solid #14202b;
            border-radius: 3px;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-family: 'Orbitron', sans-serif;
            font-size: 0.68rem;
            font-weight: 900;
            letter-spacing: 2.5px;
        }
        .brand-pedestal .tag-p1 { color: #5a829e; }
        .brand-pedestal .tag-p2 { color: #9c8038; }

        .footer-stamp {
            border-top: 1px solid #101a24;
            padding-top: 6px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.52rem;
            color: var(--text-dim);
            z-index: 10;
        }

        /* ─── 終極賽博特戰 (Cyberpunk / Tactical) 操作區 ─── */
        .action-area {
            width: 360px;
            margin-top: 12px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        /* 主按鈕：錄製動動 (暗紅金屬戰術切角按鈕) */
        .btn-motion {
            width: 100%;
            background: linear-gradient(135deg, #180a0d 0%, #2a1014 100%);
            color: #ffaa00;
            border: 1px solid #4d1c24;
            padding: 13px;
            font-family: 'Chakra Petch', sans-serif;
            font-size: 0.95rem;
            font-weight: 700;
            letter-spacing: 1.5px;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
            position: relative;
            clip-path: polygon(10px 0, 100% 0, 100% calc(100% - 10px), calc(100% - 10px) 100%, 0 100%, 0 10px);
            transition: all 0.2s ease;
            box-shadow: inset 0 0 12px rgba(255, 26, 53, 0.15), 0 4px 15px rgba(0,0,0,0.8);
        }
        .btn-motion::before {
            content: "";
            position: absolute; top: 0; left: 0; width: 4px; height: 100%;
            background: #ffaa00;
        }
        .btn-motion:active {
            background: #331218;
            border-color: #ffaa00;
            box-shadow: 0 0 16px rgba(255, 170, 0, 0.3);
            transform: scale(0.99);
        }

        /* 次按鈕：儲存靜態卡 (軍規消光灰黑線框按鈕) */
        .btn-webshare {
            width: 100%;
            background: #090f17;
            color: var(--cyan-core);
            border: 1px solid #192e42;
            padding: 11px;
            font-family: 'Chakra Petch', sans-serif;
            font-size: 0.88rem;
            font-weight: 700;
            letter-spacing: 1.5px;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
            position: relative;
            clip-path: polygon(8px 0, 100% 0, 100% calc(100% - 8px), calc(100% - 8px) 100%, 0 100%, 0 8px);
            transition: all 0.2s ease;
        }
        .btn-webshare:active {
            background: #111e2e;
            border-color: var(--cyan-core);
            box-shadow: 0 0 12px var(--cyan-glow);
        }

        /* 第三按鈕：天梯排位 (低反差暗金邊線按鈕) */
        .btn-leaderboard {
            width: 100%;
            background: #070a0f;
            color: #8da4be;
            border: 1px solid #1e2836;
            padding: 10px;
            font-family: 'Chakra Petch', sans-serif;
            font-size: 0.82rem;
            font-weight: 700;
            letter-spacing: 1.5px;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
            clip-path: polygon(8px 0, 100% 0, 100% calc(100% - 8px), calc(100% - 8px) 100%, 0 100%, 0 8px);
            transition: all 0.2s ease;
        }
        .btn-leaderboard:active {
            background: #101622;
            color: #fff;
            border-color: #556c88;
        }

        /* 預覽彈窗 */
        .preview-modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(1, 2, 4, 0.96);
            z-index: 999;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 16px;
        }

        .preview-modal video, .preview-modal img {
            max-width: 85%;
            max-height: 75vh;
            border-radius: 6px;
            border: 1px solid #1e364f;
            box-shadow: 0 0 30px rgba(0, 0, 0, 0.95);
        }

        .modal-hint {
            color: var(--neon-gold);
            font-family: 'Chakra Petch', sans-serif;
            font-size: 0.85rem;
            font-weight: bold;
            margin-top: 14px;
            text-align: center;
            letter-spacing: 1px;
        }
    </style>
</head>
<body>

    <div class="story-wrapper" id="storyCaptureArea">
        <div class="header-brand">
            <div>
                <div class="brand-title">NEURONSTRIKE</div>
                <div class="brand-sub">TACTICAL CQB // GHOSTSTEEL OS</div>
            </div>
            <div class="live-tag">
                <span class="live-dot"></span>
                <span>SHOT REPLAY LOOP</span>
            </div>
        </div>

        <div class="hero-section">
            <div class="operator-tag">
                <div class="lbl">CALLSIGN // 射手呼號</div>
                <div class="name" id="dispName">OPERATOR_GHOST</div>
            </div>
            <div class="grade-badge">
                <div class="grade" id="dispRank">PASS</div>
            </div>
        </div>

        <div class="score-display">
            <div class="score-lbl" id="dispScoreTitle">TACTICAL RUN TIME</div>
            <div class="score-val" id="dispScore">0.00s</div>
            <div class="stats-grid">
                <div class="stat-card">
                    <div class="lbl">特訓模式</div>
                    <div class="val" id="dispMode" style="color: var(--cyan-core);">COMBO</div>
                </div>
                <div class="stat-card">
                    <div class="lbl">戰術動作 / 代碼</div>
                    <div class="val" id="dispAction" style="font-size:0.75rem; color: var(--neon-green);">B-B-A</div>
                </div>
                <div class="stat-card">
                    <div class="lbl">靶道編號</div>
                    <div class="val" id="dispLane">LANE 1</div>
                </div>
            </div>
        </div>

        <div class="target-container">
            <div class="tac-steel-target">
                <div class="led-edge-strip" id="ledEdgeStrip"></div>

                <div class="target-head">
                    <div class="head-led-strip" id="headLedStrip"></div>
                    <div class="top-hang-hole"></div>
                    <div class="tac-plate" id="plt-2">2</div>
                </div>

                <div class="shoulder-line-l"></div>
                <div class="shoulder-line-r"></div>

                <div class="tac-plate" id="plt-3">3</div>
                <div class="tac-plate" id="plt-1">1</div>
                <div class="tac-plate" id="plt-4">4</div>
                <div class="tac-plate" id="plt-5">5</div>
                <div class="tac-plate" id="plt-6">6</div>
                <div class="tac-plate" id="plt-7">7</div>
                <div class="tac-plate" id="plt-8">8</div>
            </div>

            <div class="brand-pedestal">
                <span class="tag-p1">NEURONSTRIKE</span>
                <span class="tag-p2">TACTICAL</span>
            </div>
        </div>

        <div class="footer-stamp">
            <span id="dispDate">2026.09.05 // TACTICAL LAB</span>
            <span>IDPA ACCREDITED STEEL</span>
        </div>
    </div>

    <!-- 終極賽博特戰操作按鈕列 -->
    <div class="action-area">
        <button class="btn-motion" id="btnRecord" onclick="recordBoomerangMotion()">
            <span>⚡</span> 下載 IG 動動短影片 (SAVE BOOMERANG)
        </button>

        <button class="btn-webshare" id="btnShare" onclick="handleGenerateStaticShare()">
            <span>📸</span> 儲存高清靜態戰報 (SAVE IMAGE)
        </button>

        <button class="btn-leaderboard" id="btnLeaderboard" onclick="goToLeaderboard()">
            <span>🏆</span> 查看今日天梯排位 (LEADERBOARD)
        </button>
    </div>

    <!-- 預覽 Modal -->
    <div class="preview-modal" id="previewModal" onclick="closeModal()">
        <video id="previewVideo" autoplay loop muted playsinline style="display:none;"></video>
        <img id="previewImg" src="" alt="Tactical Report" style="display:none;">
        <div class="modal-hint" id="modalHint">👆 長按上方影片／圖片 儲存或分享至 IG 限動！</div>
        <div style="font-size: 0.65rem; color: #506477; margin-top: 8px;">(點擊任意空白處關閉)</div>
    </div>

    <script>
        const params = new URLSearchParams(window.location.search);
        const name = params.get('name') || "OPERATOR_GHOST";
        const lane = params.get('lane') || "1";
        const mode = (params.get('mode') || "combo").toLowerCase();
        const recordedTimeSec = Math.max(0.4, parseFloat(params.get('time')) || 1.82);
        const rank = params.get('rank') || (mode === "reaction" ? "ELITE" : "MASTER");
        const comboName = params.get('name') || "";
        const code = params.get('code') || "BBA";
        const zone = params.get('zone') || "B";

        document.getElementById("dispName").innerText = name.toUpperCase();
        document.getElementById("dispLane").innerText = `LANE 0${lane}`;
        document.getElementById("dispScore").innerText = `${recordedTimeSec.toFixed(2)}s`;
        document.getElementById("dispRank").innerText = rank;

        const now = new Date();
        document.getElementById("dispDate").innerText = 
            `${now.getFullYear()}.${String(now.getMonth() + 1).padStart(2, '0')}.${String(now.getDate()).padStart(2, '0')} // ${now.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'})}`;

        const modeTitle = document.getElementById("dispMode");
        const actionTitle = document.getElementById("dispAction");
        const scoreTitle = document.getElementById("dispScoreTitle");

        if (mode === "reaction") {
            modeTitle.innerText = "REACTION";
            modeTitle.style.color = "var(--neon-gold)";
            actionTitle.innerText = `首發 1 擊 (${zone}區)`;
            scoreTitle.innerText = "FIRST-SHOT REACTION TIME";
        } else if (mode === "combo") {
            modeTitle.innerText = "COMBO";
            modeTitle.style.color = "var(--neon-red)";
            actionTitle.innerText = comboName ? comboName.split(" ")[0] : (code || "3-HIT");
            scoreTitle.innerText = "TACTICAL COMBO TIME";
        } else if (mode === "random") {
            modeTitle.innerText = "COMMAND";
            modeTitle.style.color = "var(--neon-green)";
            actionTitle.innerText = `命中 ZONE ${zone}`;
            scoreTitle.innerText = "DECISION REACTION TIME";
        } else {
            modeTitle.innerText = "FREE FIRE";
            actionTitle.innerText = "自由校準";
            scoreTitle.innerText = "LAST SHOT TIME";
        }

        function setStrip(color, opacity = 1) {
            document.documentElement.style.setProperty('--strip-color', color);
            document.documentElement.style.setProperty('--strip-opacity', opacity);
        }

        function flashPlateAndStrip(plateId, zone, duration = 140) {
            const plate = document.getElementById(`plt-${plateId}`);
            const cls = `plate-flash-${zone.toLowerCase()}`;
            const colorMap = { A: '#ff1a35', B: '#ffaa00', C: '#00e65c' };
            const stripColor = colorMap[zone] || '#00d8e6';

            if (plate) plate.classList.add(cls);
            setStrip(stripColor, 1);

            setTimeout(() => {
                if (plate) plate.classList.remove(cls);
                setStrip('transparent', 0);
            }, duration);
        }

        function createBulletHole(plateElement, isCharlie = false) {
            if (!plateElement) return null;
            const hole = document.createElement("div");
            hole.className = "bullet-hole" + (isCharlie ? " charlie-hole" : "");
            const rx = Math.floor(Math.random() * 52) + 24;
            const ry = Math.floor(Math.random() * 52) + 24;
            hole.style.left = rx + "%";
            hole.style.top = ry + "%";
            plateElement.appendChild(hole);
            return hole;
        }

        function clearAllBulletHoles() {
            document.querySelectorAll(".bullet-hole").forEach(h => h.remove());
        }

        let shotDelays = [];
        if (recordedTimeSec <= 1.2) {
            shotDelays = [200, 200 + recordedTimeSec * 450, 200 + recordedTimeSec * 900];
        } else {
            const firstShot = Math.min(800, recordedTimeSec * 400);
            const split = (recordedTimeSec * 1000 - firstShot) / 2;
            shotDelays = [firstShot, firstShot + split, firstShot + split * 2];
        }

        let replayLoopTimer = null;

        function runOneShotReplayCycle() {
            clearAllBulletHoles();
            setStrip('transparent', 0);

            const p1 = document.getElementById("plt-1");
            const p2 = document.getElementById("plt-2");
            const p4 = document.getElementById("plt-4");

            const isMozambique = (code === "B-B-A" || code === "BBA");
            const shots = isMozambique
                ? [{ plt: 1, z: 'B', elem: p1, charlie: false }, { plt: 1, z: 'B', elem: p1, charlie: false }, { plt: 2, z: 'A', elem: p2, charlie: false }]
                : [{ plt: 4, z: 'C', elem: p4, charlie: true }, { plt: 1, z: 'B', elem: p1, charlie: false }, { plt: 2, z: 'A', elem: p2, charlie: false }];

            setTimeout(() => {
                flashPlateAndStrip(shots[0].plt, shots[0].z, 140);
                const h1 = createBulletHole(shots[0].elem, shots[0].charlie);
                setTimeout(() => { if (h1) h1.classList.add('popped'); }, 20);
            }, shotDelays[0]);

            setTimeout(() => {
                flashPlateAndStrip(shots[1].plt, shots[1].z, 140);
                const h2 = createBulletHole(shots[1].elem, shots[1].charlie);
                setTimeout(() => { if (h2) h2.classList.add('popped'); }, 20);
            }, shotDelays[1]);

            setTimeout(() => {
                flashPlateAndStrip(shots[2].plt, shots[2].z, 160);
                const h3 = createBulletHole(shots[2].elem, shots[2].charlie);
                setTimeout(() => { if (h3) h3.classList.add('popped'); }, 20);
            }, shotDelays[2]);

            const strobeStartTime = shotDelays[2] + 250;
            setTimeout(() => {
                startModeStrobe(isMozambique);
            }, strobeStartTime);

            const totalCycleTime = strobeStartTime + 1800;
            replayLoopTimer = setTimeout(() => {
                stopModeStrobe();
                runOneShotReplayCycle();
            }, totalCycleTime);
        }

        let strobeInterval = null;
        function startModeStrobe(isMozambique) {
            let step = 0;
            if (isMozambique) {
                strobeInterval = setInterval(() => {
                    const c = step % 2 === 0 ? 'var(--neon-red)' : '#0055ff';
                    setStrip(c, 1);
                    step++;
                }, 80);
            } else if (mode === "reaction") {
                strobeInterval = setInterval(() => {
                    const c = step % 2 === 0 ? 'var(--neon-gold)' : 'transparent';
                    setStrip(c, step % 2 === 0 ? 1 : 0);
                    step++;
                }, 90);
            } else {
                const rainbow = ['#ff1a35', '#ffaa00', '#00e65c', '#00d8e6', '#b026ff'];
                strobeInterval = setInterval(() => {
                    setStrip(rainbow[step % rainbow.length], 1);
                    step++;
                }, 90);
            }
        }

        function stopModeStrobe() {
            clearInterval(strobeInterval);
            setStrip('transparent', 0);
        }

        window.onload = () => {
            runOneShotReplayCycle();
        };

        async function recordBoomerangMotion() {
            const btn = document.getElementById("btnRecord");
            const originalText = btn.innerHTML;
            btn.innerHTML = "<span>🔴</span> RECORDING CYCLE...";
            btn.disabled = true;

            const targetElement = document.getElementById("storyCaptureArea");
            const canvas = document.createElement("canvas");
            canvas.width = 720;
            canvas.height = 1280;
            const ctx = canvas.getContext("2d");

            const stream = canvas.captureStream(30);
            let mediaRecorder;
            try {
                mediaRecorder = new MediaRecorder(stream, { mimeType: 'video/webm;codecs=vp9' });
            } catch (e) {
                mediaRecorder = new MediaRecorder(stream);
            }

            const chunks = [];
            mediaRecorder.ondataavailable = (e) => { if (e.data.size > 0) chunks.push(e.data); };

            mediaRecorder.onstop = () => {
                const blob = new Blob(chunks, { type: 'video/mp4' });
                const videoUrl = URL.createObjectURL(blob);

                const modal = document.getElementById("previewModal");
                const video = document.getElementById("previewVideo");
                const img = document.getElementById("previewImg");

                img.style.display = "none";
                video.style.display = "block";
                video.src = videoUrl;
                document.getElementById("modalHint").innerText = "👆 戰術動動已就緒！長按影片存入相簿，直上 IG 限動！";
                modal.style.display = "flex";

                const a = document.createElement("a");
                a.href = videoUrl;
                a.download = `GHOSTSTEEL_LOOP_${Date.now()}.mp4`;
                a.click();

                btn.innerHTML = originalText;
                btn.disabled = false;
            };

            clearTimeout(replayLoopTimer);
            stopModeStrobe();
            runOneShotReplayCycle();

            mediaRecorder.start();

            const recordDuration = Math.max(3000, shotDelays[2] + 2200);
            const startTime = performance.now();

            const renderInterval = setInterval(async () => {
                const frameCanvas = await html2canvas(targetElement, {
                    scale: 2,
                    backgroundColor: "#020406",
                    logging: false
                });
                ctx.drawImage(frameCanvas, 0, 0, 720, 1280);

                if (performance.now() - startTime > recordDuration) {
                    clearInterval(renderInterval);
                    mediaRecorder.stop();
                }
            }, 66);
        }

        async function handleGenerateStaticShare() {
            const btn = document.getElementById("btnShare");
            const originalText = btn.innerHTML;
            btn.innerHTML = "<span>⏳</span> GENERATING DOSSIER...";
            btn.disabled = true;

            try {
                const captureElement = document.getElementById("storyCaptureArea");
                const canvas = await html2canvas(captureElement, {
                    scale: 2,
                    backgroundColor: "#020406",
                    useCORS: true,
                    logging: false
                });

                const dataUrl = canvas.toDataURL("image/png");
                const modal = document.getElementById("previewModal");
                const img = document.getElementById("previewImg");
                const video = document.getElementById("previewVideo");

                video.style.display = "none";
                img.style.display = "block";
                img.src = dataUrl;
                document.getElementById("modalHint").innerText = "👆 長按上方圖片 ➜ 加入「照片」或「分享」";
                modal.style.display = "flex";
            } catch (err) {
                alert("截圖生成異常，請手動截圖保存！");
            } finally {
                btn.innerHTML = originalText;
                btn.disabled = false;
            }
        }

        function closeModal() {
            document.getElementById("previewModal").style.display = "none";
            const video = document.getElementById("previewVideo");
            video.pause();
            video.src = "";
        }

        function goToLeaderboard() {
            window.location.href = `index.html?highlight=${encodeURIComponent(name)}`;
        }
    </script>
