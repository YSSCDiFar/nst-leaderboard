<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>NEURONSTRIKE // TACTICAL AAR REPORT</title>
    <!-- 戰術電競字體 -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:ital,wght@0,600;0,700;1,700&family=Orbitron:wght@700;900&family=Share+Tech+Mono&display=swap" rel="stylesheet">
    
    <!-- 高解析截圖渲染庫 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

    <style>
        :root {
            --bg-deep: #05080c;
            --panel-bg: rgba(12, 19, 30, 0.95);
            --cyan-core: #00f0ff;
            --cyan-glow: rgba(0, 240, 255, 0.4);
            --neon-green: #00ff66;
            --neon-gold: #ffb700;
            --gold-glow: rgba(255, 183, 0, 0.5);
            --neon-red: #ff003c;
            --text-dim: #617d9d;
            --steel-dark: #121822;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background-color: #020406;
            color: #fff;
            font-family: 'Share Tech Mono', monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 10px;
            min-height: 100vh;
        }

        /* 戰術 9:16 IG 限動畫布容器 */
        .story-wrapper {
            width: 100%;
            max-width: 390px;
            aspect-ratio: 9 / 16;
            background: radial-gradient(circle at top right, #0d1a29, #05080c 80%);
            border: 1px solid rgba(0, 240, 255, 0.3);
            border-radius: 8px;
            padding: 16px 14px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            position: relative;
            overflow: hidden;
            box-shadow: 0 0 35px rgba(0, 240, 255, 0.15);
        }

        .story-wrapper::before {
            content: "";
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.35) 50%);
            background-size: 100% 4px;
            pointer-events: none;
            z-index: 99;
        }

        .header-brand {
            border-bottom: 1px solid rgba(0, 240, 255, 0.2);
            padding-bottom: 6px;
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            z-index: 10;
        }

        .brand-title {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.05rem;
            color: var(--cyan-core);
            letter-spacing: 2px;
            text-shadow: 0 0 10px var(--cyan-glow);
        }

        .brand-sub {
            font-size: 0.6rem;
            color: var(--text-dim);
            letter-spacing: 1px;
        }

        .hero-section {
            margin: 6px 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 10;
        }

        .operator-tag .lbl {
            font-size: 0.6rem;
            color: var(--text-dim);
            letter-spacing: 1.5px;
        }

        .operator-tag .name {
            font-family: 'Chakra Petch', sans-serif;
            font-weight: 700;
            font-size: 1.3rem;
            color: #fff;
            letter-spacing: 1px;
        }

        .grade-badge {
            text-align: center;
            background: rgba(255, 183, 0, 0.08);
            border: 1px solid var(--neon-gold);
            padding: 3px 14px;
            border-radius: 4px;
            box-shadow: 0 0 15px var(--gold-glow);
        }

        .grade-badge .grade {
            font-family: 'Orbitron', sans-serif;
            font-size: 2rem;
            font-weight: 900;
            color: var(--neon-gold);
            line-height: 1;
        }

        .score-display {
            background: rgba(0, 240, 255, 0.03);
            border: 1px dashed rgba(0, 240, 255, 0.2);
            border-radius: 6px;
            padding: 6px;
            text-align: center;
            z-index: 10;
        }

        .score-val {
            font-family: 'Orbitron', monospace;
            font-size: 2.8rem;
            font-weight: 900;
            color: var(--neon-green);
            text-shadow: 0 0 20px rgba(0, 255, 102, 0.4);
            line-height: 1;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 5px;
            margin-top: 4px;
        }

        .stat-card {
            background: #090e16;
            border: 1px solid rgba(0, 240, 255, 0.1);
            padding: 4px 2px;
            border-radius: 4px;
            text-align: center;
        }

        .stat-card .lbl { font-size: 0.55rem; color: var(--text-dim); }
        .stat-card .val { font-family: 'Orbitron', monospace; font-size: 0.85rem; font-weight: bold; color: #fff; margin-top: 2px; }

        /* ─── 1:1 實體不鏽鋼靶幾何架構 (真實外觀復刻) ─── */
        .target-container {
            flex-grow: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 4px 0;
            z-index: 10;
        }

        /* 主鋼板本體：金屬拉絲高光質感與外輪廓 */
        .real-steel-target {
            width: 220px;
            height: 330px;
            background: linear-gradient(135deg, #a8b2be 0%, #d6dde5 35%, #8f9aa6 70%, #b8c3ce 100%);
            border-radius: 20px 20px 10px 10px;
            position: relative;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8), inset 0 0 2px rgba(255,255,255,0.8), inset 0 0 12px rgba(0,0,0,0.4);
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* 頭部外型切線 */
        .target-head-silhouette {
            width: 86px;
            height: 80px;
            background: inherit;
            border-radius: 12px 12px 0 0;
            position: absolute;
            top: -30px;
            left: 50%;
            transform: translateX(-50%);
            box-shadow: inset 0 2px 2px rgba(255,255,255,0.7);
            border-top: 1px solid #e0e8f0;
            border-left: 1px solid #7c8894;
            border-right: 1px solid #7c8894;
        }

        /* 頂部中心懸掛穿孔 */
        .top-hang-hole {
            position: absolute;
            top: 6px;
            left: 50%;
            transform: translateX(-50%);
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #090e14;
            box-shadow: inset 0 1px 3px #000;
        }

        /* 頭部兩側雷切長縫隙 */
        .head-slot-l, .head-slot-r {
            position: absolute;
            top: 14px;
            width: 3px;
            height: 48px;
            background: #090e14;
            border-radius: 2px;
            box-shadow: inset 0 1px 2px #000;
        }
        .head-slot-l { left: 8px; }
        .head-slot-r { right: 8px; }

        /* 肩膀兩側斜切雷射減震線 */
        .shoulder-cut-l, .shoulder-cut-r {
            position: absolute;
            top: 10px;
            width: 3px;
            height: 24px;
            background: #090e14;
            border-radius: 2px;
        }
        .shoulder-cut-l { left: 45px; transform: rotate(-35deg); }
        .shoulder-cut-r { right: 45px; transform: rotate(35deg); }

        /* 實體 1~8 號鋼靶活動掛板（深邃雷切凹槽 + 髮絲紋板面） */
        .plate-hinged {
            background: linear-gradient(135deg, #b0bac5 0%, #e2eaf2 50%, #9aa6b3 100%);
            border: 2px solid #080c12; /* 雷切大縫隙 */
            box-shadow: inset 0 1px 2px rgba(255,255,255,0.9), 0 0 3px rgba(0,0,0,0.6);
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Share Tech Mono', sans-serif;
            font-weight: 900;
            color: #2b3846; /* 鋼板雷射雕刻字色 */
            position: absolute;
            cursor: pointer;
        }

        /* 板頂懸掛鉸鏈孔細節 (Hinges) */
        .plate-hinged::before, .plate-hinged::after {
            content: "";
            position: absolute;
            top: -4px;
            width: 4px;
            height: 4px;
            border-radius: 50%;
            background: #05080c;
            border: 1px solid #758391;
        }
        .plate-hinged::before { left: 22%; }
        .plate-hinged::after { right: 22%; }

        /* [2 號] 頭頂圓板 */
        #plt-2 {
            width: 48px;
            height: 46px;
            border-radius: 50%;
            top: 24px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 1.1rem;
        }
        #plt-2::before { left: 28%; }
        #plt-2::after { right: 28%; }

        /* [3 號] 頸部橫向矩形板 */
        #plt-3 {
            width: 68px;
            height: 28px;
            border-radius: 4px;
            top: 16px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 1.05rem;
        }

        /* [1 號] 胸口中心大圓板 (Alpha Heart) */
        #plt-1 {
            width: 70px;
            height: 70px;
            border-radius: 50%;
            top: 56px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 1.4rem;
        }
        #plt-1::before { left: 28%; }
        #plt-1::after { right: 28%; }

        /* [4 號 / 5 號] 兩側垂直長板 */
        #plt-4 {
            width: 36px;
            height: 86px;
            border-radius: 5px;
            top: 36px;
            left: 10px;
            font-size: 1.1rem;
        }
        #plt-5 {
            width: 36px;
            height: 86px;
            border-radius: 5px;
            top: 36px;
            right: 10px;
            font-size: 1.1rem;
        }

        /* [6 號 / 7 號 / 8 號] 下腹三塊矩形板 */
        #plt-6 {
            width: 40px;
            height: 52px;
            border-radius: 4px;
            top: 150px;
            left: 20px;
            font-size: 1.1rem;
        }
        #plt-7 {
            width: 44px;
            height: 56px;
            border-radius: 4px;
            top: 160px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 1.1rem;
        }
        #plt-8 {
            width: 40px;
            height: 52px;
            border-radius: 4px;
            top: 150px;
            right: 20px;
            font-size: 1.1rem;
        }

        /* 底部 IDPA 鏤空雷射雕刻字樣 */
        .target-idpa-stencil {
            position: absolute;
            bottom: 24px;
            left: 50%;
            transform: translateX(-50%);
            font-family: 'Chakra Petch', sans-serif;
            font-size: 1.3rem;
            font-weight: 900;
            letter-spacing: 5px;
            color: #0b1016;
            text-shadow: 0 1px 1px rgba(255,255,255,0.6);
        }

        /* 底部底座螺栓固定點 */
        .bottom-screws {
            position: absolute;
            bottom: 6px;
            width: 70%;
            display: flex;
            justify-content: space-around;
        }
        .screw-dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: #475361;
            border: 1px solid #728294;
            box-shadow: inset 0 1px 1px #000;
            position: relative;
        }
        .screw-dot::after {
            content: "+";
            position: absolute;
            top: -5px;
            left: 1px;
            font-size: 8px;
            color: #1a232c;
        }

        /* ─── 動態實體彈著孔 ─── */
        .bullet-hole {
            position: absolute;
            width: 9px;
            height: 9px;
            border-radius: 50%;
            background: radial-gradient(circle at 35% 35%, #444 10%, #111 60%, #000 100%);
            box-shadow: 0 0 6px rgba(0, 255, 102, 0.9), inset 0 0 2px #000;
            border: 1.5px solid var(--neon-green);
            transform: translate(-50%, -50%);
            z-index: 20;
        }

        .bullet-hole.charlie-hole {
            box-shadow: 0 0 6px rgba(0, 240, 255, 0.9), inset 0 0 2px #000;
            border-color: var(--cyan-core);
        }

        .footer-stamp {
            border-top: 1px solid rgba(0, 240, 255, 0.2);
            padding-top: 4px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.58rem;
            color: var(--text-dim);
            z-index: 10;
        }

        /* 操作與分享列 */
        .action-area {
            width: 100%;
            max-width: 390px;
            margin-top: 8px;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .btn-webshare {
            width: 100%;
            background: linear-gradient(90deg, #00f0ff, #00ffaa);
            color: #000;
            border: none;
            padding: 13px;
            font-family: 'Chakra Petch', sans-serif;
            font-size: 0.95rem;
            font-weight: 700;
            letter-spacing: 1.5px;
            border-radius: 6px;
            cursor: pointer;
            box-shadow: 0 0 20px var(--cyan-glow);
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
        }

        .tip-box {
            font-size: 0.68rem;
            color: var(--text-dim);
            text-align: center;
        }

        /* 預覽與長按存圖彈窗 */
        .preview-modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.92);
            z-index: 999;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 16px;
        }

        .preview-modal img {
            max-width: 85%;
            max-height: 75vh;
            border-radius: 6px;
            border: 1px solid var(--cyan-core);
            box-shadow: 0 0 25px var(--cyan-glow);
        }

        .modal-hint {
            color: var(--neon-gold);
            font-family: 'Chakra Petch', sans-serif;
            font-size: 0.95rem;
            font-weight: bold;
            margin-top: 14px;
            text-align: center;
        }
    </style>
</head>
<body>

    <!-- 9:16 IG 限動畫布 -->
    <div class="story-wrapper" id="storyCaptureArea">
        <div class="header-brand">
            <div>
                <div class="brand-title">NEURONSTRIKE</div>
                <div class="brand-sub">TACTICAL CQB // GHOSTSTEEL OS</div>
            </div>
            <div style="font-size: 0.65rem; color: var(--neon-green); font-weight: bold;">● VERIFIED AAR</div>
        </div>

        <div class="hero-section">
            <div class="operator-tag">
                <div class="lbl">CALLSIGN // 射手代號</div>
                <div class="name" id="dispName">OPERATOR_GHOST</div>
            </div>
            <div class="grade-badge">
                <div class="grade" id="dispRank">S</div>
            </div>
        </div>

        <div class="score-display">
            <div style="font-size: 0.6rem; color: var(--text-dim); letter-spacing: 2px;">FINAL SCORE TIME</div>
            <div class="score-val" id="dispScore">0.00s</div>
            <div class="stats-grid">
                <div class="stat-card">
                    <div class="lbl">淨耗時 (Raw)</div>
                    <div class="val" id="dispRaw">0.00s</div>
                </div>
                <div class="stat-card">
                    <div class="lbl">ALPHA 獎勵</div>
                    <div class="val" id="dispAlpha" style="color: var(--neon-green);">-0.0s</div>
                </div>
                <div class="stat-card">
                    <div class="lbl">懲罰加秒</div>
                    <div class="val" id="dispPenalty" style="color: var(--neon-red);">+0.0s</div>
                </div>
            </div>
        </div>

        <!-- 1:1 實體 IDPA 鋼靶容器 -->
        <div class="target-container">
            <div class="real-steel-target">
                <!-- 頭部結構與懸掛孔 -->
                <div class="target-head-silhouette">
                    <div class="top-hang-hole"></div>
                    <div class="head-slot-l"></div>
                    <div class="head-slot-r"></div>
                    <!-- [2 號] 頭部圓形活動板 -->
                    <div class="plate-hinged" id="plt-2">2</div>
                </div>

                <!-- 肩部斜切減震槽 -->
                <div class="shoulder-cut-l"></div>
                <div class="shoulder-cut-r"></div>

                <!-- [3 號] 頸部橫向矩形板 -->
                <div class="plate-hinged" id="plt-3">3</div>

                <!-- [1 號] 心胸中心大圓板 -->
                <div class="plate-hinged" id="plt-1">1</div>

                <!-- [4 號 / 5 號] 兩側外圍垂直板 -->
                <div class="plate-hinged" id="plt-4">4</div>
                <div class="plate-hinged" id="plt-5">5</div>

                <!-- [6 號 / 7 號 / 8 號] 下腹矩形板 -->
                <div class="plate-hinged" id="plt-6">6</div>
                <div class="plate-hinged" id="plt-7">7</div>
                <div class="plate-hinged" id="plt-8">8</div>

                <!-- 底部 IDPA 鏤空字樣 -->
                <div class="target-idpa-stencil">IDPA</div>

                <!-- 底座固定螺栓細節 -->
                <div class="bottom-screws">
                    <div class="screw-dot"></div>
                    <div class="screw-dot"></div>
                </div>
            </div>
        </div>

        <div class="footer-stamp">
            <span id="dispDate">2026.09.02 // TACTICAL LAB</span>
            <span>IDPA ACCREDITED STEEL</span>
        </div>
    </div>

    <!-- 底部操作列 -->
    <div class="action-area">
        <button class="btn-webshare" id="btnShare" onclick="handleGenerateShare()">
            <span>📸</span> 產生高畫質限動卡 (SAVE & SHARE)
        </button>
        <div class="tip-box">
            點擊後長按圖片，即可直接儲存相簿或發送至 IG 限動！
        </div>
    </div>

    <!-- 預覽長按存圖彈窗 -->
    <div class="preview-modal" id="previewModal" onclick="closeModal()">
        <img id="generatedImg" src="" alt="Tactical Report">
        <div class="modal-hint">👆 長按上方圖片 ➜ 加入「照片」或「分享」</div>
        <div style="font-size: 0.7rem; color: var(--text-dim); margin-top: 8px;">(點擊任意空白處關閉)</div>
    </div>

    <script>
        // 1. 抓取參數
        const params = new URLSearchParams(window.location.search);
        const name = params.get('name') || "Operator_Ghost";
        const score = parseFloat(params.get('score')) || 3.20;
        const raw = parseFloat(params.get('raw')) || 4.10;
        const alpha = parseInt(params.get('alpha')) || 3;
        const penalty = parseFloat(params.get('penalty')) || 0.0;
        const rank = params.get('rank') || (score < 3.5 ? "S" : (score < 4.5 ? "A" : "B"));

        // 2. 渲染戰術數據
        document.getElementById("dispName").innerText = name.toUpperCase();
        document.getElementById("dispScore").innerText = score.toFixed(2) + "s";
        document.getElementById("dispRaw").innerText = raw.toFixed(2) + "s";
        document.getElementById("dispAlpha").innerText = `-${(alpha * 0.3).toFixed(1)}s`;
        document.getElementById("dispPenalty").innerText = `+${penalty.toFixed(1)}s`;
        document.getElementById("dispRank").innerText = rank;

        const now = new Date();
        document.getElementById("dispDate").innerText = 
            `${now.getFullYear()}.${String(now.getMonth() + 1).padStart(2, '0')}.${String(now.getDate()).padStart(2, '0')} // ${now.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'})}`;

        // ─── 3. 動態彈著孔生成函式 ───
        function spawnBulletHole(plateElement, isCharlie = false) {
            if (!plateElement) return;
            const hole = document.createElement("div");
            hole.className = "bullet-hole" + (isCharlie ? " charlie-hole" : "");

            // 確保彈孔落在板內並產生天然散佈
            const padding = 20;
            const randomX = Math.floor(Math.random() * (100 - padding * 2)) + padding;
            const randomY = Math.floor(Math.random() * (100 - padding * 2)) + padding;

            hole.style.left = randomX + "%";
            hole.style.top = randomY + "%";
            plateElement.appendChild(hole);
        }

        // 抓取 1~8 號活動鋼板
        const p1 = document.getElementById("plt-1"); // 心臟大圓 (Alpha)
        const p2 = document.getElementById("plt-2"); // 頭頂圓 (Alpha Head)
        const p3 = document.getElementById("plt-3"); // 頸部板
        const p4 = document.getElementById("plt-4"); // 左側外圍
        const p5 = document.getElementById("plt-5"); // 右側外圍
        const p6 = document.getElementById("plt-6"); // 左下腹
        const p7 = document.getElementById("plt-7"); // 中下腹
        const p8 = document.getElementById("plt-8"); // 右下腹

        // 依據 Alpha 獎勵發數在核心 1、2、7 號板產生彈著群 (Grouping)
        for (let i = 0; i < alpha; i++) {
            if (i === 0) spawnBulletHole(p1); // 第 1 發心臟中心 (1號)
            else if (i === 1) spawnBulletHole(p2); // 第 2 發爆頭 (2號)
            else if (i === 2) spawnBulletHole(p1); // 第 3 發再度命中胸口 (1號重複散佈)
            else spawnBulletHole(p7); // 第 4 發命中下腹 (7號)
        }

        // 外圍 Charlie 散佈（命中兩側或邊緣板）
        spawnBulletHole(p4, true);
        spawnBulletHole(p5, true);

        // ─── 4. 一鍵生成高畫質限動圖 ───
        async function handleGenerateShare() {
            const btn = document.getElementById("btnShare");
            const originalText = btn.innerHTML;
            btn.innerHTML = "<span>⏳</span> 正在產生戰術圖卡...";
            btn.disabled = true;

            try {
                const captureElement = document.getElementById("storyCaptureArea");
                const canvas = await html2canvas(captureElement, {
                    scale: 3,
                    backgroundColor: "#05080c",
                    useCORS: true
                });

                const dataUrl = canvas.toDataURL("image/png");

                // 若在外部獨立瀏覽器中，先嘗試喚起原生分享
                if (navigator.share && !navigator.userAgent.includes("Line")) {
                    canvas.toBlob(async (blob) => {
                        const file = new File([blob], `NST_AAR_${name}.png`, { type: "image/png" });
                        if (navigator.canShare && navigator.canShare({ files: [file] })) {
                            try {
                                await navigator.share({
                                    files: [file],
                                    title: "NEURONSTRIKE 戰術射擊戰報",
                                    text: `特戰幹員 [${name}] 在 GhostSteel 達成 ${score.toFixed(2)}s！`
                                });
                                btn.innerHTML = originalText;
                                btn.disabled = false;
                                return;
                            } catch (e) {}
                        }
                        showPreviewModal(dataUrl);
                        btn.innerHTML = originalText;
                        btn.disabled = false;
                    });
                } else {
                    // LINE 內建瀏覽器直接彈出預覽供長按保存
                    showPreviewModal(dataUrl);
                    btn.innerHTML = originalText;
                    btn.disabled = false;
                }
            } catch (err) {
                console.error("生成失敗:", err);
                alert("生成異常，請直接手動截圖！");
                btn.innerHTML = originalText;
                btn.disabled = false;
            }
        }

        function showPreviewModal(imgSrc) {
            const modal = document.getElementById("previewModal");
            const img = document.getElementById("generatedImg");
            img.src = imgSrc;
            modal.style.display = "flex";
        }

        function closeModal() {
            document.getElementById("previewModal").style.display = "none";
        }
    </script>
</body>
</html>
