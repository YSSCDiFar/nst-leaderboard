<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>NEURONSTRIKE // TACTICAL AAR REPORT</title>
    <!-- 戰術電競字體 -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:ital,wght@0,600;0,700;1,700&family=Orbitron:wght@700;900&family=Share+Tech+Mono&display=swap" rel="stylesheet">
    
    <!-- 高解析截圖渲染庫 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

    <style>
        :root {
            --bg-deep: #05080c;
            --panel-bg: rgba(12, 19, 30, 0.95);
            --cyan-core: #00f0ff;
            --cyan-glow: rgba(0, 240, 255, 0.4);
            --neon-green: #00ff66;
            --neon-gold: #ffb700;
            --gold-glow: rgba(255, 183, 0, 0.5);
            --neon-red: #ff003c;
            --text-dim: #617d9d;
            --steel-dark: #121822;
            --steel-plate: #1a2536;
            --steel-border: #2a3d56;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background-color: #020406;
            color: #fff;
            font-family: 'Share Tech Mono', monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 12px;
            min-height: 100vh;
        }

        /* 戰術 9:16 IG 限動畫布容器 */
        .story-wrapper {
            width: 100%;
            max-width: 390px;
            aspect-ratio: 9 / 16;
            background: radial-gradient(circle at top right, #0d1a29, #05080c 80%);
            border: 1px solid rgba(0, 240, 255, 0.3);
            border-radius: 8px;
            padding: 20px 18px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            position: relative;
            overflow: hidden;
            box-shadow: 0 0 35px rgba(0, 240, 255, 0.15);
        }

        /* 戰術掃描線效果 */
        .story-wrapper::before {
            content: "";
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.35) 50%);
            background-size: 100% 4px;
            pointer-events: none;
            z-index: 9;
        }

        .header-brand {
            border-bottom: 1px solid rgba(0, 240, 255, 0.2);
            padding-bottom: 8px;
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            z-index: 10;
        }

        .brand-title {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.1rem;
            color: var(--cyan-core);
            letter-spacing: 2px;
            text-shadow: 0 0 10px var(--cyan-glow);
        }

        .brand-sub {
            font-size: 0.65rem;
            color: var(--text-dim);
            letter-spacing: 1px;
        }

        /* 射手代號與核心評級 */
        .hero-section {
            margin: 10px 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 10;
        }

        .operator-tag .lbl {
            font-size: 0.65rem;
            color: var(--text-dim);
            letter-spacing: 1.5px;
        }

        .operator-tag .name {
            font-family: 'Chakra Petch', sans-serif;
            font-weight: 700;
            font-size: 1.4rem;
            color: #fff;
            letter-spacing: 1px;
        }

        .grade-badge {
            text-align: center;
            background: rgba(255, 183, 0, 0.08);
            border: 1px solid var(--neon-gold);
            padding: 4px 16px;
            border-radius: 4px;
            box-shadow: 0 0 15px var(--gold-glow);
        }

        .grade-badge .grade {
            font-family: 'Orbitron', sans-serif;
            font-size: 2.2rem;
            font-weight: 900;
            color: var(--neon-gold);
            line-height: 1;
        }

        /* 核心秒數與數據矩陣 */
        .score-display {
            background: rgba(0, 240, 255, 0.03);
            border: 1px dashed rgba(0, 240, 255, 0.2);
            border-radius: 6px;
            padding: 10px;
            text-align: center;
            z-index: 10;
        }

        .score-val {
            font-family: 'Orbitron', monospace;
            font-size: 3.2rem;
            font-weight: 900;
            color: var(--neon-green);
            text-shadow: 0 0 20px rgba(0, 255, 102, 0.4);
            line-height: 1;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 6px;
            margin-top: 8px;
        }

        .stat-card {
            background: #090e16;
            border: 1px solid rgba(0, 240, 255, 0.1);
            padding: 6px 4px;
            border-radius: 4px;
            text-align: center;
        }

        .stat-card .lbl { font-size: 0.6rem; color: var(--text-dim); }
        .stat-card .val { font-family: 'Orbitron', monospace; font-size: 0.95rem; font-weight: bold; color: #fff; margin-top: 2px; }

        /* ─── 1:1 實體雷切鋼靶可視化 (2-2-4 分區架構) ─── */
        .target-container {
            flex-grow: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 10px 0;
            z-index: 10;
        }

        .steel-target {
            width: 180px;
            height: 220px;
            background: var(--steel-dark);
            border: 2px solid var(--steel-border);
            clip-path: polygon(25% 0%, 75% 0%, 75% 15%, 100% 30%, 100% 100%, 0% 100%, 0% 30%, 25% 15%);
            display: grid;
            grid-template-rows: 1.2fr 2.5fr;
            gap: 4px;
            padding: 8px 6px;
            position: relative;
            box-shadow: inset 0 0 20px rgba(0,0,0,0.9);
        }

        /* 頭部 (2, 3 號板) */
        .zone-head-group {
            display: flex;
            flex-direction: column;
            gap: 3px;
            align-items: center;
        }

        .plate-head-top {
            width: 32px;
            height: 18px;
            background: var(--steel-plate);
            border: 1px solid #3b4e68;
            border-radius: 50% 50% 2px 2px;
        }

        .plate-head-bot {
            width: 44px;
            height: 16px;
            background: var(--steel-plate);
            border: 1px solid #3b4e68;
            border-radius: 2px;
        }

        /* 軀幹 (1, 7 號心胸 + 4, 5, 6, 8 號外圍) */
        .zone-body-group {
            display: grid;
            grid-template-columns: 1fr 1.6fr 1fr;
            gap: 4px;
            height: 100%;
        }

        .plate-outer-col {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .plate-flank {
            flex-grow: 1;
            background: var(--steel-plate);
            border: 1px solid #3b4e68;
            border-radius: 2px;
        }

        .plate-center-col {
            display: flex;
            flex-direction: column;
            gap: 4px;
            align-items: center;
        }

        .plate-heart-circle {
            width: 52px;
            height: 52px;
            border-radius: 50%;
            background: var(--steel-plate);
            border: 1px solid #3b4e68;
        }

        .plate-abdomen {
            width: 54px;
            flex-grow: 1;
            background: var(--steel-plate);
            border: 1px solid #3b4e68;
            border-radius: 2px;
        }

        /* 命中發光動畫類別 */
        .plate-hit-alpha {
            background: rgba(0, 255, 102, 0.45) !important;
            border-color: var(--neon-green) !important;
            box-shadow: 0 0 15px var(--neon-green);
        }

        .plate-hit-charlie {
            background: rgba(0, 240, 255, 0.35) !important;
            border-color: var(--cyan-core) !important;
            box-shadow: 0 0 12px var(--cyan-glow);
        }

        .footer-stamp {
            border-top: 1px solid rgba(0, 240, 255, 0.2);
            padding-top: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.62rem;
            color: var(--text-dim);
            z-index: 10;
        }

        /* ─── Web Share 專屬原生轉發按鈕 ─── */
        .action-area {
            width: 100%;
            max-width: 390px;
            margin-top: 12px;
        }

        .btn-webshare {
            width: 100%;
            background: linear-gradient(90deg, #00f0ff, #00ffaa);
            color: #000;
            border: none;
            padding: 15px;
            font-family: 'Chakra Petch', sans-serif;
            font-size: 1.05rem;
            font-weight: 700;
            letter-spacing: 1.5px;
            border-radius: 6px;
            cursor: pointer;
            box-shadow: 0 0 20px var(--cyan-glow);
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
            transition: all 0.2s;
        }

        .btn-webshare:active {
            transform: scale(0.98);
        }
    </style>
</head>
<body>

    <!-- 9:16 IG 限動截圖目標容器 -->
    <div class="story-wrapper" id="storyCaptureArea">
        <div class="header-brand">
            <div>
                <div class="brand-title">NEURONSTRIKE</div>
                <div class="brand-sub">TACTICAL CQB // GHOSTSTEEL OS</div>
            </div>
            <div style="font-size: 0.65rem; color: var(--neon-green); font-weight: bold;">● VERIFIED AAR</div>
        </div>

        <div class="hero-section">
            <div class="operator-tag">
                <div class="lbl">CALLSIGN // 射手代號</div>
                <div class="name" id="dispName">OPERATOR_GHOST</div>
            </div>
            <div class="grade-badge">
                <div class="grade" id="dispRank">S</div>
            </div>
        </div>

        <div class="score-display">
            <div style="font-size: 0.65rem; color: var(--text-dim); letter-spacing: 2px;">FINAL SCORE TIME</div>
            <div class="score-val" id="dispScore">0.00s</div>
            <div class="stats-grid">
                <div class="stat-card">
                    <div class="lbl">淨耗時 (Raw)</div>
                    <div class="val" id="dispRaw">0.00s</div>
                </div>
                <div class="stat-card">
                    <div class="lbl">ALPHA 獎勵</div>
                    <div class="val" id="dispAlpha" style="color: var(--neon-green);">-0.0s</div>
                </div>
                <div class="stat-card">
                    <div class="lbl">懲罰加秒</div>
                    <div class="val" id="dispPenalty" style="color: var(--neon-red);">+0.0s</div>
                </div>
            </div>
        </div>

        <!-- 1:1 實體雷切鋼靶圖 -->
        <div class="target-container">
            <div class="steel-target">
                <!-- 頭部 2, 3 號板 -->
                <div class="zone-head-group">
                    <div class="plate-head-top" id="plt-2"></div>
                    <div class="plate-head-bot" id="plt-3"></div>
                </div>
                <!-- 軀幹 1, 7 號心胸 + 4, 5, 6, 8 號外圍板 -->
                <div class="zone-body-group">
                    <div class="plate-outer-col">
                        <div class="plate-flank" id="plt-4"></div>
                        <div class="plate-flank" id="plt-6"></div>
                    </div>
                    <div class="plate-center-col">
                        <div class="plate-heart-circle" id="plt-1"></div>
                        <div class="plate-abdomen" id="plt-7"></div>
                    </div>
                    <div class="plate-outer-col">
                        <div class="plate-flank" id="plt-5"></div>
                        <div class="plate-flank" id="plt-8"></div>
                    </div>
                </div>
            </div>
        </div>

        <div class="footer-stamp">
            <span id="dispDate">2026.09.02 // TACTICAL LAB</span>
            <span>IDPA ACCREDITED</span>
        </div>
    </div>

    <!-- 呼叫 Web Share 原生轉發面板的按鈕 -->
    <div class="action-area">
        <button class="btn-webshare" id="btnShare" onclick="handleNativeShare()">
            <span>⚡</span> 分享至 IG 限動 / Threads / LINE
        </button>
    </div>

    <script>
        // 1. 從 URL 抓取戰情報表參數
        const params = new URLSearchParams(window.location.search);
        const name = params.get('name') || "Operator_Ghost";
        const score = parseFloat(params.get('score')) || 3.20;
        const raw = parseFloat(params.get('raw')) || 4.10;
        const alpha = parseInt(params.get('alpha')) || 3;
        const penalty = parseFloat(params.get('penalty')) || 0.0;
        const rank = params.get('rank') || (score < 3.5 ? "S" : (score < 4.5 ? "A" : "B"));

        // 2. 渲染戰術數據
        document.getElementById("dispName").innerText = name.toUpperCase();
        document.getElementById("dispScore").innerText = score.toFixed(2) + "s";
        document.getElementById("dispRaw").innerText = raw.toFixed(2) + "s";
        document.getElementById("dispAlpha").innerText = `-${(alpha * 0.3).toFixed(1)}s`;
        document.getElementById("dispPenalty").innerText = `+${penalty.toFixed(1)}s`;
        document.getElementById("dispRank").innerText = rank;

        const now = new Date();
        document.getElementById("dispDate").innerText = 
            `${now.getFullYear()}.${String(now.getMonth() + 1).padStart(2, '0')}.${String(now.getDate()).padStart(2, '0')} // ${now.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'})}`;

        // 3. 模擬 1:1 實體鋼靶著彈亮燈特效
        if (alpha > 0) {
            document.getElementById("plt-1").classList.add("plate-hit-alpha"); // 心胸大圓
            if (alpha >= 2) document.getElementById("plt-2").classList.add("plate-hit-alpha"); // 頭部
            if (alpha >= 3) document.getElementById("plt-7").classList.add("plate-hit-alpha"); // 下腹
        }
        document.getElementById("plt-4").classList.add("plate-hit-charlie");
        document.getElementById("plt-5").classList.add("plate-hit-charlie");

        // 4. 核心 Web Share API 原生轉發邏輯
        async function handleNativeShare() {
            const btn = document.getElementById("btnShare");
            const originalText = btn.innerHTML;
            btn.innerHTML = "<span>⏳</span> 正在生成高清戰術圖...";
            btn.disabled = true;

            try {
                const captureElement = document.getElementById("storyCaptureArea");
                
                // 使用 html2canvas 以 3 倍超採樣繪製 9:16 高清圖
                const canvas = await html2canvas(captureElement, {
                    scale: 3,
                    backgroundColor: "#05080c",
                    useCORS: true
                });

                // 轉為 Blob 二進位檔案以供原生分享
                canvas.toBlob(async (blob) => {
                    const file = new File([blob], `NST_AAR_${name}_${Date.now()}.png`, { type: "image/png" });

                    // 檢查瀏覽器是否支援 Web Share 檔案分享 (iOS Safari / Android Chrome 最佳支援)
                    if (navigator.canShare && navigator.canShare({ files: [file] })) {
                        try {
                            await navigator.share({
                                files: [file],
                                title: "NEURONSTRIKE 戰術射擊戰報",
                                text: `特戰幹員 [${name}] 在 GhostSteel 達成 ${score.toFixed(2)}s (${rank} 級)！快來挑戰！`
                            });
                        } catch (err) {
                            if (err.name !== "AbortError") {
                                fallbackDownload(canvas);
                            }
                        }
                    } else {
                        // 若為不支援原生分享的桌面瀏覽器，降級為直接下載
                        fallbackDownload(canvas);
                    }

                    btn.innerHTML = originalText;
                    btn.disabled = false;
                }, "image/png");

            } catch (error) {
                console.error("分享生成失敗:", error);
                alert("圖片生成異常，請直接手動截圖保存！");
                btn.innerHTML = originalText;
                btn.disabled = false;
            }
        }

        // 備用下載函式
        function fallbackDownload(canvas) {
            const link = document.createElement("a");
            link.download = `NST_AAR_${name}_${Date.now()}.png`;
            link.href = canvas.toDataURL("image/png");
            link.click();
        }
    </script>
</body>
</html>
