<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>NEURONSTRIKE // TACTICAL AAR REPORT</title>
    <!-- 戰術電競字體 -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:ital,wght@0,600;0,700;1,700&family=Orbitron:wght@700;900&family=Share+Tech+Mono&display=swap" rel="stylesheet">
    
    <!-- 高解析截圖渲染庫 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

    <style>
        :root {
            --bg-deep: #05080c;
            --panel-bg: rgba(12, 19, 30, 0.95);
            --cyan-core: #00f0ff;
            --cyan-glow: rgba(0, 240, 255, 0.4);
            --neon-green: #00ff66;
            --neon-gold: #ffb700;
            --gold-glow: rgba(255, 183, 0, 0.5);
            --neon-red: #ff003c;
            --text-dim: #617d9d;
            --steel-dark: #111722;
            --steel-plate: #182333;
            --steel-border: #2c3e55;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background-color: #020406;
            color: #fff;
            font-family: 'Share Tech Mono', monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 12px;
            min-height: 100vh;
        }

        /* 戰術 9:16 IG 限動畫布容器 */
        .story-wrapper {
            width: 100%;
            max-width: 390px;
            aspect-ratio: 9 / 16;
            background: radial-gradient(circle at top right, #0d1a29, #05080c 80%);
            border: 1px solid rgba(0, 240, 255, 0.3);
            border-radius: 8px;
            padding: 20px 18px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            position: relative;
            overflow: hidden;
            box-shadow: 0 0 35px rgba(0, 240, 255, 0.15);
        }

        /* 戰術掃描線效果 */
        .story-wrapper::before {
            content: "";
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.35) 50%);
            background-size: 100% 4px;
            pointer-events: none;
            z-index: 9;
        }

        .header-brand {
            border-bottom: 1px solid rgba(0, 240, 255, 0.2);
            padding-bottom: 8px;
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            z-index: 10;
        }

        .brand-title {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.1rem;
            color: var(--cyan-core);
            letter-spacing: 2px;
            text-shadow: 0 0 10px var(--cyan-glow);
        }

        .brand-sub {
            font-size: 0.65rem;
            color: var(--text-dim);
            letter-spacing: 1px;
        }

        /* 射手代號與核心評級 */
        .hero-section {
            margin: 8px 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 10;
        }

        .operator-tag .lbl {
            font-size: 0.65rem;
            color: var(--text-dim);
            letter-spacing: 1.5px;
        }

        .operator-tag .name {
            font-family: 'Chakra Petch', sans-serif;
            font-weight: 700;
            font-size: 1.35rem;
            color: #fff;
            letter-spacing: 1px;
        }

        .grade-badge {
            text-align: center;
            background: rgba(255, 183, 0, 0.08);
            border: 1px solid var(--neon-gold);
            padding: 4px 16px;
            border-radius: 4px;
            box-shadow: 0 0 15px var(--gold-glow);
        }

        .grade-badge .grade {
            font-family: 'Orbitron', sans-serif;
            font-size: 2.2rem;
            font-weight: 900;
            color: var(--neon-gold);
            line-height: 1;
        }

        /* 核心秒數與數據矩陣 */
        .score-display {
            background: rgba(0, 240, 255, 0.03);
            border: 1px dashed rgba(0, 240, 255, 0.2);
            border-radius: 6px;
            padding: 8px;
            text-align: center;
            z-index: 10;
        }

        .score-val {
            font-family: 'Orbitron', monospace;
            font-size: 3rem;
            font-weight: 900;
            color: var(--neon-green);
            text-shadow: 0 0 20px rgba(0, 255, 102, 0.4);
            line-height: 1;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 6px;
            margin-top: 6px;
        }

        .stat-card {
            background: #090e16;
            border: 1px solid rgba(0, 240, 255, 0.1);
            padding: 5px 4px;
            border-radius: 4px;
            text-align: center;
        }

        .stat-card .lbl { font-size: 0.58rem; color: var(--text-dim); }
        .stat-card .val { font-family: 'Orbitron', monospace; font-size: 0.9rem; font-weight: bold; color: #fff; margin-top: 2px; }

        /* ─── 1:1 實體雷切鋼靶容器 ─── */
        .target-container {
            flex-grow: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 6px 0;
            z-index: 10;
        }

        .steel-target {
            width: 200px;
            height: 240px;
            background: var(--steel-dark);
            border: 2px solid var(--steel-border);
            clip-path: polygon(25% 0%, 75% 0%, 75% 15%, 100% 30%, 100% 100%, 0% 100%, 0% 30%, 25% 15%);
            display: grid;
            grid-template-rows: 1.2fr 2.5fr;
            gap: 4px;
            padding: 8px 6px;
            position: relative;
            box-shadow: inset 0 0 20px rgba(0,0,0,0.9);
        }

        /* 頭部 (2, 3 號板) */
        .zone-head-group {
            display: flex;
            flex-direction: column;
            gap: 3px;
            align-items: center;
            position: relative;
        }

        .plate-head-top {
            width: 36px;
            height: 20px;
            background: var(--steel-plate);
            border: 1px solid #3b4e68;
            border-radius: 50% 50% 2px 2px;
            position: relative;
        }

        .plate-head-bot {
            width: 50px;
            height: 18px;
            background: var(--steel-plate);
            border: 1px solid #3b4e68;
            border-radius: 2px;
            position: relative;
        }

        /* 軀幹 (1, 7 號心胸 + 4, 5, 6, 8 號外圍) */
        .zone-body-group {
            display: grid;
            grid-template-columns: 1fr 1.6fr 1fr;
            gap: 4px;
            height: 100%;
            position: relative;
        }

        .plate-outer-col {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .plate-flank {
            flex-grow: 1;
            background: var(--steel-plate);
            border: 1px solid #3b4e68;
            border-radius: 2px;
            position: relative;
        }

        .plate-center-col {
            display: flex;
            flex-direction: column;
            gap: 4px;
            align-items: center;
            position: relative;
        }

        .plate-heart-circle {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background: var(--steel-plate);
            border: 1px solid #3b4e68;
            position: relative;
        }

        .plate-abdomen {
            width: 60px;
            flex-grow: 1;
            background: var(--steel-plate);
            border: 1px solid #3b4e68;
            border-radius: 2px;
            position: relative;
        }

        /* ─── 真實動態彈著點 (Bullet Impact Holes) ─── */
        .bullet-hole {
            position: absolute;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: radial-gradient(circle at 35% 35%, #555 10%, #111 60%, #000 100%);
            box-shadow: 0 0 6px rgba(0, 255, 102, 0.8), inset 0 0 2px #000;
            border: 1.5px solid var(--neon-green);
            transform: translate(-50%, -50%);
            z-index: 20;
        }

        .bullet-hole.charlie-hole {
            box-shadow: 0 0 6px rgba(0, 240, 255, 0.8), inset 0 0 2px #000;
            border-color: var(--cyan-core);
        }

        .footer-stamp {
            border-top: 1px solid rgba(0, 240, 255, 0.2);
            padding-top: 6px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.62rem;
            color: var(--text-dim);
            z-index: 10;
        }

        /* ─── 操作與分享區 ─── */
        .action-area {
            width: 100%;
            max-width: 390px;
            margin-top: 10px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .btn-webshare {
            width: 100%;
            background: linear-gradient(90deg, #00f0ff, #00ffaa);
            color: #000;
            border: none;
            padding: 14px;
            font-family: 'Chakra Petch', sans-serif;
            font-size: 1rem;
            font-weight: 700;
            letter-spacing: 1.5px;
            border-radius: 6px;
            cursor: pointer;
            box-shadow: 0 0 20px var(--cyan-glow);
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
        }

        .tip-box {
            font-size: 0.7rem;
            color: var(--text-dim);
            text-align: center;
            line-height: 1.4;
        }

        /* 生成彈窗預覽 (解決 LINE 內建瀏覽器無法調用原生選單的問題) */
        .preview-modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.92);
            z-index: 999;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 16px;
        }

        .preview-modal img {
            max-width: 85%;
            max-height: 75vh;
            border-radius: 6px;
            border: 1px solid var(--cyan-core);
            box-shadow: 0 0 25px var(--cyan-glow);
        }

        .modal-hint {
            color: var(--neon-gold);
            font-family: 'Chakra Petch', sans-serif;
            font-size: 0.95rem;
            font-weight: bold;
            margin-top: 14px;
            text-align: center;
        }
    </style>
</head>
<body>

    <!-- 9:16 IG 限動畫布 -->
    <div class="story-wrapper" id="storyCaptureArea">
        <div class="header-brand">
            <div>
                <div class="brand-title">NEURONSTRIKE</div>
                <div class="brand-sub">TACTICAL CQB // GHOSTSTEEL OS</div>
            </div>
            <div style="font-size: 0.65rem; color: var(--neon-green); font-weight: bold;">● VERIFIED AAR</div>
        </div>

        <div class="hero-section">
            <div class="operator-tag">
                <div class="lbl">CALLSIGN // 射手代號</div>
                <div class="name" id="dispName">OPERATOR_GHOST</div>
            </div>
            <div class="grade-badge">
                <div class="grade" id="dispRank">S</div>
            </div>
        </div>

        <div class="score-display">
            <div style="font-size: 0.62rem; color: var(--text-dim); letter-spacing: 2px;">FINAL SCORE TIME</div>
            <div class="score-val" id="dispScore">0.00s</div>
            <div class="stats-grid">
                <div class="stat-card">
                    <div class="lbl">淨耗時 (Raw)</div>
                    <div class="val" id="dispRaw">0.00s</div>
                </div>
                <div class="stat-card">
                    <div class="lbl">ALPHA 獎勵</div>
                    <div class="val" id="dispAlpha" style="color: var(--neon-green);">-0.0s</div>
                </div>
                <div class="stat-card">
                    <div class="lbl">懲罰加秒</div>
                    <div class="val" id="dispPenalty" style="color: var(--neon-red);">+0.0s</div>
                </div>
            </div>
        </div>

        <!-- 1:1 實體雷切鋼靶與彈著孔 -->
        <div class="target-container">
            <div class="steel-target">
                <!-- 頭部 2, 3 號板 -->
                <div class="zone-head-group">
                    <div class="plate-head-top" id="plt-2"></div>
                    <div class="plate-head-bot" id="plt-3"></div>
                </div>
                <!-- 軀幹 1, 7 號心胸 + 4, 5, 6, 8 號外圍板 -->
                <div class="zone-body-group">
                    <div class="plate-outer-col">
                        <div class="plate-flank" id="plt-4"></div>
                        <div class="plate-flank" id="plt-6"></div>
                    </div>
                    <div class="plate-center-col">
                        <div class="plate-heart-circle" id="plt-1"></div>
                        <div class="plate-abdomen" id="plt-7"></div>
                    </div>
                    <div class="plate-outer-col">
                        <div class="plate-flank" id="plt-5"></div>
                        <div class="plate-flank" id="plt-8"></div>
                    </div>
                </div>
            </div>
        </div>

        <div class="footer-stamp">
            <span id="dispDate">2026.09.02 // TACTICAL LAB</span>
            <span>IDPA ACCREDITED</span>
        </div>
    </div>

    <!-- 底部操作列 -->
    <div class="action-area">
        <button class="btn-webshare" id="btnShare" onclick="handleGenerateShare()">
            <span>📸</span> 產生高畫質限動卡 (SAVE & SHARE)
        </button>
        <div class="tip-box">
            點擊後「長按圖片」即可直接存入相簿或發送至 IG 限動 / Threads！
        </div>
    </div>

    <!-- 預覽長按存圖彈窗 -->
    <div class="preview-modal" id="previewModal" onclick="closeModal()">
        <img id="generatedImg" src="" alt="Tactical Report">
        <div class="modal-hint">👆 長按上方圖片 ➜ 加入「照片」或「分享」</div>
        <div style="font-size: 0.7rem; color: var(--text-dim); margin-top: 8px;">(點擊任意空白處關閉)</div>
    </div>

    <script>
        // 1. 抓取參數
        const params = new URLSearchParams(window.location.search);
        const name = params.get('name') || "Operator_Ghost";
        const score = parseFloat(params.get('score')) || 3.20;
        const raw = parseFloat(params.get('raw')) || 4.10;
        const alpha = parseInt(params.get('alpha')) || 3;
        const penalty = parseFloat(params.get('penalty')) || 0.0;
        const rank = params.get('rank') || (score < 3.5 ? "S" : (score < 4.5 ? "A" : "B"));

        // 2. 渲染戰術數據
        document.getElementById("dispName").innerText = name.toUpperCase();
        document.getElementById("dispScore").innerText = score.toFixed(2) + "s";
        document.getElementById("dispRaw").innerText = raw.toFixed(2) + "s";
        document.getElementById("dispAlpha").innerText = `-${(alpha * 0.3).toFixed(1)}s`;
        document.getElementById("dispPenalty").innerText = `+${penalty.toFixed(1)}s`;
        document.getElementById("dispRank").innerText = rank;

        const now = new Date();
        document.getElementById("dispDate").innerText = 
            `${now.getFullYear()}.${String(now.getMonth() + 1).padStart(2, '0')}.${String(now.getDate()).padStart(2, '0')} // ${now.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'})}`;

        // ─── 3. 真實動態彈著點生成函式 ───
        function spawnBulletHole(plateElement, isCharlie = false) {
            if (!plateElement) return;
            const hole = document.createElement("div");
            hole.className = "bullet-hole" + (isCharlie ? " charlie-hole" : "");

            // 在靶板範圍內產生帶有微小偏差的自然散佈座標
            const padding = 20; // 邊緣保留
            const randomX = Math.floor(Math.random() * (100 - padding * 2)) + padding;
            const randomY = Math.floor(Math.random() * (100 - padding * 2)) + padding;

            hole.style.left = randomX + "%";
            hole.style.top = randomY + "%";
            plateElement.appendChild(hole);
        }

        // 依據命中數在對應分區打出具體彈著點 (支援同區重複射擊)
        const heartPlate = document.getElementById("plt-1"); // 心臟大圓
        const headTop = document.getElementById("plt-2");    // 頭部上頂
        const headBot = document.getElementById("plt-3");    // 頭部下板
        const leftFlank = document.getElementById("plt-4");  // 左側外圍
        const rightFlank = document.getElementById("plt-5"); // 右側外圍
        const abdomen = document.getElementById("plt-7");   // 下腹

        // 繪製 Alpha 彈孔
        for (let i = 0; i < alpha; i++) {
            if (i === 0) spawnBulletHole(heartPlate); // 第 1 發心臟中心
            else if (i === 1) spawnBulletHole(headTop); // 第 2 發頭部
            else if (i === 2) spawnBulletHole(heartPlate); // 第 3 發再度命中胸口 (同區重複散佈)
            else spawnBulletHole(abdomen);
        }

        // 繪製 Charlie 彈孔 (外圍散佈)
        spawnBulletHole(leftFlank, true);
        spawnBulletHole(rightFlank, true);

        // ─── 4. 一鍵生成高畫質限動圖 (相容 LINE 內建瀏覽器) ───
        async function handleGenerateShare() {
            const btn = document.getElementById("btnShare");
            const originalText = btn.innerHTML;
            btn.innerHTML = "<span>⏳</span> 正在產生戰術圖卡...";
            btn.disabled = true;

            try {
                const captureElement = document.getElementById("storyCaptureArea");
                const canvas = await html2canvas(captureElement, {
                    scale: 3,
                    backgroundColor: "#05080c",
                    useCORS: true
                });

                const dataUrl = canvas.toDataURL("image/png");

                // 若在支援原生分享的外部獨立瀏覽器中，先嘗試呼叫系統分享
                if (navigator.share && !navigator.userAgent.includes("Line")) {
                    canvas.toBlob(async (blob) => {
                        const file = new File([blob], `NST_AAR_${name}.png`, { type: "image/png" });
                        if (navigator.canShare && navigator.canShare({ files: [file] })) {
                            try {
                                await navigator.share({
                                    files: [file],
                                    title: "NEURONSTRIKE 戰術射擊戰報",
                                    text: `特戰幹員 [${name}] 在 GhostSteel 達成 ${score.toFixed(2)}s！`
                                });
                                btn.innerHTML = originalText;
                                btn.disabled = false;
                                return;
                            } catch (e) {}
                        }
                        showPreviewModal(dataUrl);
                        btn.innerHTML = originalText;
                        btn.disabled = false;
                    });
                } else {
                    // LINE 內建環境：直接彈出高清圖片供射手「長按儲存/分享」
                    showPreviewModal(dataUrl);
                    btn.innerHTML = originalText;
                    btn.disabled = false;
                }
            } catch (err) {
                console.error("生成失敗:", err);
                alert("生成異常，請直接手動截圖！");
                btn.innerHTML = originalText;
                btn.disabled = false;
            }
        }

        function showPreviewModal(imgSrc) {
            const modal = document.getElementById("previewModal");
            const img = document.getElementById("generatedImg");
            img.src = imgSrc;
            modal.style.display = "flex";
        }

        function closeModal() {
            document.getElementById("previewModal").style.display = "none";
        }
    </script>
</body>
</html>
