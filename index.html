<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>NST // KILLINGLANE TACTICAL LEADERBOARD</title>
    <!-- 戰術電競字體 -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:ital,wght@0,600;0,700;1,700&family=Orbitron:wght@700;900&family=Share+Tech+Mono&display=swap" rel="stylesheet">
    
    <!-- LINE LIFF SDK -->
    <script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>

    <!-- Firebase Web SDK (v8 穩定版) -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

    <style>
        :root {
            --bg-deep: #03060a;
            --panel-bg: rgba(8, 14, 22, 0.95);
            --panel-card: #0b1420;
            --cyan-core: #00f0ff;
            --cyan-glow: rgba(0, 240, 255, 0.4);
            --neon-green: #00ff66;
            --neon-gold: #ffaa00;
            --gold-glow: rgba(255, 170, 0, 0.45);
            --neon-red: #ff1a35;
            --text-dim: #55708d;
            --text-bright: #e2f1ff;
            --border: #152538;
            --border-bright: #1f3650;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background-color: var(--bg-deep);
            color: var(--text-bright);
            font-family: 'Share Tech Mono', monospace;
            padding: 12px;
            min-height: 100vh;
            max-width: 520px;
            margin: 0 auto;
            position: relative;
            /* 純淨向量微網格，完全無 CRT 雜訊與掃描線 */
            background-image: 
                linear-gradient(rgba(0, 240, 255, 0.02) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 240, 255, 0.02) 1px, transparent 1px);
            background-size: 24px 24px;
        }

        .header {
            text-align: center;
            padding-bottom: 10px;
            border-bottom: 1px solid var(--border);
            margin-bottom: 12px;
        }
        .header h2 {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.25rem;
            color: var(--cyan-core);
            letter-spacing: 2px;
            text-shadow: 0 0 10px var(--cyan-glow);
        }
        .status-tag {
            font-size: 0.7rem;
            color: var(--text-dim);
            margin-top: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }
        .status-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: var(--neon-green);
            box-shadow: 0 0 6px var(--neon-green);
        }

        /* 射手個人身分 HUD 卡片 */
        .operator-card {
            background: rgba(0, 240, 255, 0.04);
            border: 1px solid var(--border);
            border-radius: 6px;
            padding: 10px 14px;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
        }
        .profile-info { display: flex; align-items: center; gap: 10px; }
        .profile-avatar {
            width: 40px; height: 40px; border-radius: 50%;
            border: 1.5px solid var(--cyan-core);
            box-shadow: 0 0 8px var(--cyan-glow);
            object-fit: cover; background: #0b1420;
        }
        .profile-text .title { font-size: 0.65rem; color: var(--text-dim); letter-spacing: 1px; }
        .profile-text .name { font-family: 'Chakra Petch', sans-serif; font-weight: 700; font-size: 1rem; color: #fff; }
        .my-rank-tag { text-align: right; }
        .my-rank-tag .rank-label { font-size: 0.65rem; color: var(--text-dim); }
        .my-rank-tag .rank-val { font-family: 'Orbitron', sans-serif; font-size: 1.15rem; color: var(--neon-gold); font-weight: 900; }

        /* 戰術三段切換標籤 (Tabs) */
        .tab-group {
            display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin-bottom: 12px;
        }
        .tab-btn {
            background: #090f18; border: 1px solid var(--border); color: var(--text-dim);
            padding: 10px 4px; font-family: 'Chakra Petch', sans-serif; font-weight: 700;
            font-size: 0.85rem; letter-spacing: 1px; text-align: center;
            cursor: pointer; border-radius: 4px; transition: all 0.2s ease;
        }
        .tab-btn.active {
            background: rgba(0, 240, 255, 0.12); border-color: var(--cyan-core);
            color: var(--cyan-core); box-shadow: 0 0 12px rgba(0, 240, 255, 0.25);
        }
        .tab-btn.apex-tab.active {
            background: rgba(255, 170, 0, 0.12); border-color: var(--neon-gold);
            color: var(--neon-gold); box-shadow: 0 0 14px var(--gold-glow);
        }

        /* 巔峰傳奇特寫展示區 (Apex Legend Stage) */
        .apex-hero-card {
            background: radial-gradient(circle at top right, rgba(255, 170, 0, 0.12), rgba(9, 15, 24, 0.95) 75%);
            border: 1px solid var(--neon-gold); border-radius: 6px; padding: 14px 16px; margin-bottom: 12px;
            text-align: center; position: relative;
            box-shadow: 0 0 25px rgba(255, 170, 0, 0.15);
        }
        .apex-title { font-family: 'Chakra Petch', sans-serif; font-size: 0.72rem; letter-spacing: 2px; color: var(--neon-gold); font-weight: 700; margin-bottom: 4px; }
        .apex-name { font-family: 'Orbitron', sans-serif; font-size: 1.4rem; font-weight: 900; color: #ffffff; margin-bottom: 2px; }
        .apex-time { font-family: 'Orbitron', monospace; font-size: 2.8rem; font-weight: 900; color: var(--cyan-core); text-shadow: 0 0 18px var(--cyan-glow); line-height: 1.1; }
        .apex-meta { font-size: 0.72rem; color: #8da4be; margin-top: 6px; display: flex; justify-content: center; gap: 10px; }
        .apex-meta span { color: #fff; }

        /* 排行榜表格容器 (純淨高對比) */
        .table-container { 
            background: var(--panel-bg); 
            border: 1px solid var(--border); 
            border-radius: 6px; 
            overflow: hidden; 
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.6); 
        }
        table { width: 100%; border-collapse: collapse; }
        th, td { padding: 10px 8px; text-align: center; border-bottom: 1px solid #101c2b; font-size: 0.85rem; }
        th { font-family: 'Chakra Petch', sans-serif; color: var(--cyan-core); font-size: 0.75rem; letter-spacing: 1px; background: #080e16; border-bottom: 1px solid var(--border-bright); }
        .score { font-family: 'Orbitron', monospace; font-weight: 900; color: var(--cyan-core); text-shadow: 0 0 8px rgba(0, 240, 255, 0.3); }

        .mod-tag { font-size: 0.65rem; color: var(--text-dim); }

        /* 金銀銅牌高亮 */
        tr:nth-child(1) td { color: var(--neon-gold); font-weight: bold; }
        tr:nth-child(1) .score { color: var(--neon-gold); text-shadow: 0 0 10px var(--gold-glow); }
        tr:nth-child(2) td { color: #d0e0f0; }
        tr:nth-child(3) td { color: #cd7f32; }

        /* 本人或跳轉高亮行 */
        tr.highlight-row {
            background: rgba(0, 240, 255, 0.12) !important;
            border-left: 3px solid var(--neon-green);
        }
        tr.highlight-row td {
            color: #fff !important; font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="header">
        <h2>NEURONSTRIKE // LEADERBOARD</h2>
        <div class="status-tag">
            <div class="status-dot"></div>
            <span id="statusTag">KILLINGLANE 20M 連線中...</span>
        </div>
    </div>

    <!-- LINE 身分個人 HUD -->
    <div class="operator-card" id="operatorCard" style="display: none;">
        <div class="profile-info">
            <img class="profile-avatar" id="userAvatar" src="" alt="Avatar">
            <div class="profile-text">
                <div class="title">ACTIVE OPERATOR</div>
                <div class="name" id="userName">--</div>
            </div>
        </div>
        <div class="my-rank-tag">
            <div class="rank-label">CURRENT RANK</div>
            <div class="rank-val" id="userBestRank">--</div>
        </div>
    </div>

    <div class="tab-group">
        <div class="tab-btn active" id="tabDaily" onclick="switchView('daily')">⚡ 當日戰況</div>
        <div class="tab-btn" id="tabMonthly" onclick="switchView('monthly')">📅 每月天梯</div>
        <div class="tab-btn apex-tab" id="tabApex" onclick="switchView('apex')">🏆 巔峰傳奇</div>
    </div>

    <div class="apex-hero-card" id="apexHero" style="display: none;">
        <div class="apex-title">⚡ ALL-TIME APEX OPERATOR // 最速傳奇 ⚡</div>
        <div class="apex-name" id="apexName">--</div>
        <div class="apex-time" id="apexTime">0.00s</div>
        <div class="apex-meta" id="apexMeta">實跑: --  //  人質加罰: --  //  重點獎勵: --</div>
    </div>

    <div class="table-container">
        <table>
            <thead>
                <tr>
                    <th style="width: 14%;">#</th>
                    <th style="width: 44%; text-align: left; padding-left: 12px;">OPERATOR</th>
                    <th style="width: 26%;">FINAL</th>
                    <th style="width: 16%;">RAW</th>
                </tr>
            </thead>
            <tbody id="boardData">
                <tr><td colspan="4" style="padding: 24px; color: var(--text-dim);">讀取戰術數據中...</td></tr>
            </tbody>
        </table>
    </div>

    <script>
        // ==========================================
        // 1. Firebase 核心設定
        // ==========================================
        const firebaseConfig = {
            apiKey: "AIzaSyArJJA38NiEyQs1spfNSBDTOne_INJ7d5k",
            authDomain: "nst-killhouse.firebaseapp.com",
            databaseURL: "https://nst-killhouse-default-rtdb.firebaseio.com",
            projectId: "nst-killhouse",
            storageBucket: "nst-killhouse.firebasestorage.app",
            messagingSenderId: "637304240805",
            appId: "1:637304240805:web:37a2b7cdfdc9fb46596b4c"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        // ==========================================
        // 2. 系統變數與 LINE LIFF
        // ==========================================
        const LIFF_ID = "2011351699-1AubGp3r";
        let currentLineUser = null;
        let allRecordsCache = [];
        let currentTab = "daily"; 
        
        const urlParams = new URLSearchParams(window.location.search);
        const highlightTarget = urlParams.get('highlight');

        async function initLineLiff() {
            try {
                await liff.init({ liffId: LIFF_ID });
                if (liff.isLoggedIn()) {
                    const profile = await liff.getProfile();
                    currentLineUser = {
                        name: profile.displayName,
                        userId: profile.userId,
                        pictureUrl: profile.pictureUrl || "https://static.line-scdn.net/line_client/img/default_profile.png"
                    };
                    document.getElementById("userName").innerText = currentLineUser.name;
                    document.getElementById("userAvatar").src = currentLineUser.pictureUrl;
                    document.getElementById("operatorCard").style.display = "flex";
                }
            } catch (err) {
                console.warn("[LIFF] 訪客模式運行");
            }
        }

        // ==========================================
        // 3. 啟動 Firebase 監聽 (直連 KillingLane)
        // ==========================================
        function startLiveSync() {
            document.getElementById("statusTag").innerText = "KILLINGLANE 雲端直連 // 監聽中";

            // 直連 killinglane 專用天梯節點
            db.ref("GhostSteel/Leaderboard/killinglane").on('value', (snapshot) => {
                const data = snapshot.val();
                if (!data) {
                    allRecordsCache = [];
                } else {
                    allRecordsCache = Object.values(data);
                }
                renderView();
                
                const tag = document.getElementById("statusTag");
                tag.innerText = "資料已同步 // " + new Date().toLocaleTimeString();
                tag.style.color = "var(--neon-green)";
            });
        }

        function switchView(tabType) {
            currentTab = tabType;
            document.getElementById("tabDaily").className = "tab-btn" + (tabType === 'daily' ? ' active' : '');
            document.getElementById("tabMonthly").className = "tab-btn" + (tabType === 'monthly' ? ' active' : '');
            document.getElementById("tabApex").className = "tab-btn apex-tab" + (tabType === 'apex' ? ' active' : '');
            renderView();
        }

        // ==========================================
        // 4. 核心過濾與渲染引擎
        // ==========================================
        function renderView() {
            if (allRecordsCache.length === 0) {
                document.getElementById("boardData").innerHTML = "<tr><td colspan='4' style='padding: 24px; color: var(--text-dim);'>尚無特訓紀錄</td></tr>";
                document.getElementById("apexHero").style.display = "none";
                return;
            }

            const now = new Date();
            const startOfToday = new Date(now.getFullYear(), now.getMonth(), now.getDate()).getTime();
            const startOfMonth = new Date(now.getFullYear(), now.getMonth(), 1).getTime();

            // 尋找全時期最速傳奇 (final_time 最小者)
            let apexRecord = [...allRecordsCache].sort((a, b) => Number(a.final_time || a.time) - Number(b.final_time || b.time))[0];
            if (apexRecord) {
                const finalScore = Number(apexRecord.final_time || apexRecord.time).toFixed(2);
                const rawScore = Number(apexRecord.raw_time || apexRecord.time).toFixed(2);
                const hPenalty = `+${((apexRecord.hostage_hits || 0) * 3.0).toFixed(1)}s`;
                const pBuff = `-${((apexRecord.priority_hits || 0) * 1.5).toFixed(1)}s`;

                document.getElementById("apexName").innerText = (apexRecord.operator || 'ANONYMOUS').toUpperCase();
                document.getElementById("apexTime").innerText = `${finalScore}s`;
                document.getElementById("apexMeta").innerHTML = `實跑: <span>${rawScore}s</span> // 人質: <span style="color:var(--neon-green);">${hPenalty}</span> // 重點: <span style="color:var(--neon-gold);">${pBuff}</span>`;
                document.getElementById("apexHero").style.display = (currentTab === 'apex') ? "block" : "none";
            }

            // 依據選取的 Tab 進行時間過濾
            let filtered = [];
            if (currentTab === "daily") {
                filtered = allRecordsCache.filter(r => (r.timestamp || 0) >= startOfToday);
            } else if (currentTab === "monthly") {
                filtered = allRecordsCache.filter(r => (r.timestamp || 0) >= startOfMonth);
            } else if (currentTab === "apex") {
                // 巔峰模式：每位射手僅取最佳紀錄 (Personal Best)
                const pbMap = new Map();
                allRecordsCache.forEach(r => {
                    const name = (r.operator || 'Anonymous').trim();
                    const score = Number(r.final_time || r.time);
                    if (!pbMap.has(name) || score < pbMap.get(name).score) {
                        pbMap.set(name, { ...r, calculatedScore: score });
                    }
                });
                filtered = Array.from(pbMap.values());
            }

            // 依照結算秒數由小到大排序 (Ascending: 越小越強)
            filtered.sort((a, b) => Number(a.final_time || a.time) - Number(b.final_time || b.time));

            let tbody = document.getElementById("boardData");
            if (filtered.length === 0) {
                tbody.innerHTML = `<tr><td colspan='4' style='padding: 24px; color: var(--text-dim);'>該時段尚無戰況數據</td></tr>`;
                if (currentLineUser) document.getElementById("userBestRank").innerText = "--";
                return;
            }

            let html = "";
            let myRank = "--";

            filtered.forEach((r, idx) => {
                let rankBadge = idx === 0 ? "🥇 1" : (idx === 1 ? "🥈 2" : (idx === 2 ? "🥉 3" : idx + 1));
                let finalScoreNum = Number(r.final_time || r.time);
                let rawScoreNum = Number(r.raw_time || r.time);
                let displayFinal = !isNaN(finalScoreNum) ? finalScoreNum.toFixed(2) + "s" : "--";
                let displayRaw = !isNaN(rawScoreNum) ? rawScoreNum.toFixed(2) + "s" : "--";
                let opName = r.operator || 'Anonymous';
                
                let isMe = currentLineUser && (opName.trim().toUpperCase() === currentLineUser.name.trim().toUpperCase());
                let isHighlight = highlightTarget && (opName.trim().toUpperCase() === highlightTarget.trim().toUpperCase());

                if (isMe && myRank === "--") {
                    myRank = `#${idx + 1}`;
                }

                html += `<tr class="${(isMe || isHighlight) ? 'highlight-row' : ''}">
                    <td>${rankBadge}</td>
                    <td style="text-align: left; padding-left: 12px;">
                        ${isMe ? '👤 ' : ''}${opName.toUpperCase()}
                    </td>
                    <td class="score">${displayFinal}</td>
                    <td class="mod-tag">${displayRaw}</td>
                </tr>`;
            });

            tbody.innerHTML = html;
            if (currentLineUser) document.getElementById("userBestRank").innerText = myRank;

            if (highlightTarget) {
                setTimeout(() => {
                    const targetRow = document.querySelector('.highlight-row');
                    if (targetRow) targetRow.scrollIntoView({ behavior: 'smooth', block: 'center' });
                }, 300);
            }
        }

        window.onload = async () => {
            await initLineLiff();
            startLiveSync();
        };
    </script>
</body>
</html>
