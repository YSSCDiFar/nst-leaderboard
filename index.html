<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NST 戰術射擊即時天梯榜</title>
    <!-- LIFF SDK -->
    <script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
    <style>
        :root {
            --bg-dark: #0a0e14;
            --card-bg: #121820;
            --neon-blue: #00d2ff;
            --neon-gold: #ffb700;
            --text-main: #f0f4f8;
            --border: #22354c;
        }
        body {
            margin: 0; padding: 15px;
            background: var(--bg-dark); color: var(--text-main);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, monospace;
        }
        .header {
            text-align: center; padding-bottom: 15px;
            border-bottom: 1px solid var(--border); margin-bottom: 15px;
        }
        h2 { margin: 0; color: var(--neon-blue); letter-spacing: 2px; }
        .refresh-tag { font-size: 0.75rem; color: #708090; margin-top: 5px; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th, td { padding: 12px 8px; text-align: center; border-bottom: 1px solid var(--border); }
        th { color: var(--neon-blue); font-size: 0.85rem; }
        tr:nth-child(1) td { color: var(--neon-gold); font-weight: bold; font-size: 1.1rem; }
        .score { font-weight: 900; color: #00ff66; }
    </style>
</head>
<body>

    <div class="header">
        <h2>NST TACTICAL LEADERBOARD</h2>
        <div class="refresh-tag" id="status">即時同步連線中...</div>
    </div>

    <table>
        <thead>
            <tr>
                <th>名次</th>
                <th>射手 (Operator)</th>
                <th>成績 (Time)</th>
                <th>Alpha</th>
            </tr>
        </thead>
        <tbody id="boardData">
            <tr><td colspan="4">資料讀取中...</td></tr>
        </tbody>
    </table>

    <script>
        // 替換成你的 Firebase 資料庫 URL
        const FIREBASE_URL = "https://https://nst-killhouse-default-rtdb.firebaseio.com/-default-rtdb.firebaseio.com/leaderboard.json";

        async function fetchLeaderboard() {
            try {
                let res = await fetch(FIREBASE_URL);
                let data = await res.json();
                
                if (!data) {
                    document.getElementById("boardData").innerHTML = "<tr><td colspan='4'>目前尚無射擊成績</td></tr>";
                    return;
                }

                // 將 Firebase 物件轉換為陣列並排序 (秒數越少名次越前面)
                let records = Object.values(data);
                records.sort((a, b) => a.score - b.score);

                let html = "";
                records.forEach((r, idx) => {
                    let rankBadge = idx === 0 ? "🥇 1" : (idx === 1 ? "🥈 2" : (idx === 2 ? "🥉 3" : idx + 1));
                    html += `<tr>
                        <td>${rankBadge}</td>
                        <td>${r.name || 'Anonymous'}</td>
                        <td class="score">${parseFloat(r.score).toFixed(2)}s</td>
                        <td>${r.alpha || 0}</td>
                    </tr>`;
                });

                document.getElementById("boardData").innerHTML = html;
                document.getElementById("status").innerText = "最後更新: " + new Date().toLocaleTimeString();
            } catch (err) {
                console.error("載入失敗:", err);
                document.getElementById("status").innerText = "載入失敗，請確認網路連線";
            }
        }

        // 初始化
        window.onload = () => {
            fetchLeaderboard();
            // 每 10 秒自動重新整理天梯榜
            setInterval(fetchLeaderboard, 10000);
        };
    </script>
</body>
</html>
