<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>NST // TACTICAL LEADERBOARD</title>
    <!-- 引入專業戰術字體 -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:ital,wght@0,600;0,700;1,700&family=Orbitron:wght@700;900&family=Share+Tech+Mono&display=swap" rel="stylesheet">
    
    <!-- LINE LIFF SDK 官方 CDN -->
    <script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>

    <style>
        :root {
            --bg-deep: #05080c;
            --panel-bg: rgba(10, 16, 26, 0.85);
            --cyan-core: #00f0ff;
            --cyan-glow: rgba(0, 240, 255, 0.4);
            --neon-green: #00ff66;
            --neon-gold: #ffb700;
            --gold-glow: rgba(255, 183, 0, 0.4);
            --text-dim: #617d9d;
            --text-bright: #e2f1ff;
            --border: #1a2a3e;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background-color: var(--bg-deep);
            color: var(--text-bright);
            font-family: 'Share Tech Mono', monospace;
            padding: 14px;
            min-height: 100vh;
            position: relative;
        }

        /* 戰術掃描線背景 */
        body::before {
            content: "";
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.35) 50%);
            background-size: 100% 4px;
            pointer-events: none;
            z-index: 99;
        }

        .header {
            text-align: center;
            padding-bottom: 12px;
            border-bottom: 1px solid var(--border);
            margin-bottom: 12px;
        }
        .header h2 {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.3rem;
            color: var(--cyan-core);
            letter-spacing: 2px;
            text-shadow: 0 0 10px var(--cyan-glow);
        }
        .status-tag {
            font-size: 0.72rem;
            color: var(--text-dim);
            margin-top: 4px;
        }

        /* 射手個人身分 HUD 卡片 */
        .operator-card {
            background: rgba(0, 240, 255, 0.04);
            border: 1px solid var(--border);
            border-radius: 6px;
            padding: 10px 14px;
            margin-bottom: 14px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow: inset 0 0 15px rgba(0, 240, 255, 0.02);
        }
        .profile-info {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .profile-avatar {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            border: 2px solid var(--cyan-core);
            box-shadow: 0 0 8px var(--cyan-glow);
            object-fit: cover;
            background: #111b27;
        }
        .profile-text .title {
            font-size: 0.68rem;
            color: var(--text-dim);
            letter-spacing: 1px;
        }
        .profile-text .name {
            font-family: 'Chakra Petch', sans-serif;
            font-weight: 700;
            font-size: 1.05rem;
            color: #fff;
        }
        .my-rank-tag {
            text-align: right;
        }
        .my-rank-tag .rank-label {
            font-size: 0.65rem;
            color: var(--text-dim);
        }
        .my-rank-tag .rank-val {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.1rem;
            color: var(--neon-gold);
            font-weight: 900;
        }

        /* 排行榜表格 */
        .table-container {
            background: var(--panel-bg);
            border: 1px solid var(--border);
            border-radius: 6px;
            overflow: hidden;
        }
        table {
            width: 100%;
            border-collapse: collapse;
        }
        th, td {
            padding: 10px 8px;
            text-align: center;
            border-bottom: 1px solid rgba(255, 255, 255, 0.04);
            font-size: 0.85rem;
        }
        th {
            font-family: 'Chakra Petch', sans-serif;
            color: var(--cyan-core);
            font-size: 0.78rem;
            letter-spacing: 1px;
            background: #091019;
            border-bottom: 1px solid var(--border);
        }
        .score {
            font-family: 'Orbitron', monospace;
            font-weight: 900;
            color: var(--neon-green);
        }

        /* 第一名專屬榮譽色 */
        tr:nth-child(1) td {
            color: var(--neon-gold);
            font-weight: bold;
        }

        /* 本人命中高亮樣式 */
        tr.my-record {
            background: rgba(0, 240, 255, 0.08) !important;
            border-left: 3px solid var(--cyan-core);
        }
        tr.my-record td {
            color: #fff !important;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="header">
        <h2>NEURONSTRIKE // LEADERBOARD</h2>
        <div class="status-tag" id="statusTag">LIFF SENSOR CONNECTING...</div>
    </div>

    <!-- LINE 登入身分顯示區 -->
    <div class="operator-card" id="operatorCard" style="display: none;">
        <div class="profile-info">
            <img class="profile-avatar" id="userAvatar" src="" alt="Avatar">
            <div class="profile-text">
                <div class="title">ACTIVE OPERATOR</div>
                <div class="name" id="userName">--</div>
            </div>
        </div>
        <div class="my-rank-tag">
            <div class="rank-label">CURRENT RANK</div>
            <div class="rank-val" id="userBestRank">--</div>
        </div>
    </div>

    <!-- 排行榜清單 -->
    <div class="table-container">
        <table>
            <thead>
                <tr>
                    <th style="width: 15%;">#</th>
                    <th style="width: 45%;">OPERATOR</th>
                    <th style="width: 25%;">TIME</th>
                    <th style="width: 15%;">ALPHA</th>
                </tr>
            </thead>
            <tbody id="boardData">
                <tr><td colspan="4" style="padding: 20px; color: var(--text-dim);">戰報數據載入中...</td></tr>
            </tbody>
        </table>
    </div>

    <script>
        // ─── [設定區] ───
        const FIREBASE_URL = "https://你的Firebase專案名稱-default-rtdb.firebaseio.com/leaderboard.json";
        const LIFF_ID = "2011351699-1AubGp3r";

        let currentLineUser = null;

        // 1. 初始化 LINE LIFF
        async function initLineLiff() {
            try {
                await liff.init({ liffId: LIFF_ID });
                if (liff.isLoggedIn()) {
                    const profile = await liff.getProfile();
                    currentLineUser = {
                        name: profile.displayName,
                        userId: profile.userId,
                        pictureUrl: profile.pictureUrl || "https://static.line-scdn.net/line_client/img/default_profile.png"
                    };

                    // 更新頂部幹員身分卡
                    document.getElementById("userName").innerText = currentLineUser.name;
                    document.getElementById("userAvatar").src = currentLineUser.pictureUrl;
                    document.getElementById("operatorCard").style.display = "flex";
                } else {
                    // 若在外部瀏覽器未登入，可選擇引導登入或維持訪客模式
                    console.log("LIFF 處於未登入狀態");
                }
            } catch (err) {
                console.warn("[LIFF] 初始化異常或非 LINE 環境:", err);
            }
        }

        // 2. 從 Firebase 抓取成績並進行即時渲染
        async function fetchLeaderboard() {
            try {
                let res = await fetch(FIREBASE_URL);
                let data = await res.json();

                if (!data) {
                    document.getElementById("boardData").innerHTML = "<tr><td colspan='4' style='padding: 20px;'>目前尚無射擊成績</td></tr>";
                    document.getElementById("statusTag").innerText = "天梯系統就緒 // 尚無紀錄";
                    return;
                }

                // 排序：總秒數越小名次越前
                let records = Object.values(data);
                records.sort((a, b) => Number(a.score) - Number(b.score));

                let html = "";
                let myBestRank = "--";

                records.forEach((r, idx) => {
                    let rankBadge = idx === 0 ? "🥇 1" : (idx === 1 ? "🥈 2" : (idx === 2 ? "🥉 3" : idx + 1));
                    let scoreNum = Number(r.score);
                    let displayScore = !isNaN(scoreNum) ? scoreNum.toFixed(2) + "s" : "--";
                    let alphaCount = r.alpha !== undefined ? r.alpha : 0;
                    let opName = r.name || 'Anonymous';

                    // 判斷是否為當前 LINE 登入射手
                    let isMe = currentLineUser && (opName.trim() === currentLineUser.name.trim());
                    if (isMe && myBestRank === "--") {
                        myBestRank = `#${idx + 1}`;
                    }

                    html += `<tr class="${isMe ? 'my-record' : ''}">
                        <td>${rankBadge}</td>
                        <td style="text-align: left; padding-left: 12px;">
                            ${isMe ? '👤 ' : ''}${opName}
                        </td>
                        <td class="score">${displayScore}</td>
                        <td>${alphaCount}</td>
                    </tr>`;
                });

                document.getElementById("boardData").innerHTML = html;
                document.getElementById("statusTag").innerText = "即時連線中 // 最後更新 " + new Date().toLocaleTimeString();
                
                if (currentLineUser) {
                    document.getElementById("userBestRank").innerText = myBestRank;
                }
            } catch (err) {
                console.error("[Firebase] 載入失敗:", err);
                document.getElementById("statusTag").innerText = "連線異常，請檢查網路";
            }
        }

        // 啟動流程
        window.onload = async () => {
            await initLineLiff();
            await fetchLeaderboard();
            setInterval(fetchLeaderboard, 10000); // 每 10 秒自動同步
        };
    </script>
</body>
</html>
