<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>OPERATOR ID // TACTICAL PASS</title>
    <!-- 戰術字體 -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:ital,wght@0,600;0,700;1,700&family=Orbitron:wght@700;900&family=Share+Tech+Mono&display=swap" rel="stylesheet">
    
    <!-- LINE LIFF SDK 與 QRCode 產生器 -->
    <script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>

    <style>
        :root {
            --bg-deep: #05080c;
            --card-bg: rgba(12, 19, 30, 0.95);
            --cyan-core: #00f0ff;
            --cyan-glow: rgba(0, 240, 255, 0.4);
            --neon-green: #00ff66;
            --neon-gold: #ffb700;
            --gold-glow: rgba(255, 183, 0, 0.5);
            --text-dim: #617d9d;
            --border: #1a2a3e;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background-color: var(--bg-deep);
            color: #fff;
            font-family: 'Share Tech Mono', monospace;
            padding: 14px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* 戰術掃描線背景 */
        body::before {
            content: "";
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.35) 50%);
            background-size: 100% 4px;
            pointer-events: none;
            z-index: 99;
        }

        .id-dossier {
            width: 100%;
            max-width: 380px;
            background: var(--card-bg);
            border: 1px solid var(--cyan-core);
            border-radius: 8px;
            padding: 20px;
            box-shadow: 0 0 25px var(--cyan-glow);
            position: relative;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border);
            padding-bottom: 10px;
            margin-bottom: 15px;
        }

        .header .agency {
            font-family: 'Orbitron', sans-serif;
            font-size: 0.85rem;
            color: var(--cyan-core);
            letter-spacing: 2px;
        }

        .operator-hero {
            display: flex;
            gap: 15px;
            align-items: center;
            margin-bottom: 18px;
        }

        .avatar {
            width: 72px;
            height: 72px;
            border-radius: 4px;
            border: 2px solid var(--cyan-core);
            object-fit: cover;
            background: #111b27;
            box-shadow: 0 0 10px var(--cyan-glow);
        }

        .op-meta .lbl {
            font-size: 0.65rem;
            color: var(--text-dim);
            letter-spacing: 1px;
        }

        .op-meta .name {
            font-family: 'Chakra Petch', sans-serif;
            font-weight: 700;
            font-size: 1.25rem;
            color: #fff;
            margin: 2px 0 4px 0;
        }

        .op-meta .uid {
            font-size: 0.68rem;
            color: var(--cyan-core);
            word-break: break-all;
        }

        /* 現場報到條碼區 */
        .checkin-section {
            background: rgba(0, 240, 255, 0.04);
            border: 1px dashed var(--border);
            border-radius: 6px;
            padding: 14px;
            text-align: center;
            margin-bottom: 18px;
        }

        .checkin-title {
            font-family: 'Chakra Petch', sans-serif;
            font-size: 0.75rem;
            letter-spacing: 1.5px;
            color: var(--cyan-core);
            margin-bottom: 10px;
        }

        .qr-box {
            display: inline-block;
            padding: 6px;
            background: #fff;
            border-radius: 4px;
            line-height: 0;
        }

        .checkin-hint {
            font-size: 0.68rem;
            color: var(--text-dim);
            margin-top: 8px;
        }

        /* 個人歷史最佳 PB 戰績卡 */
        .pb-section {
            border-top: 1px solid var(--border);
            padding-top: 14px;
        }

        .pb-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }

        .pb-title {
            font-family: 'Chakra Petch', sans-serif;
            font-size: 0.8rem;
            letter-spacing: 1px;
            color: var(--neon-gold);
            font-weight: 700;
        }

        .pb-hero {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #080d14;
            border: 1px solid rgba(255, 183, 0, 0.3);
            border-radius: 6px;
            padding: 12px 16px;
        }

        .pb-time {
            font-family: 'Orbitron', monospace;
            font-size: 2.2rem;
            font-weight: 900;
            color: var(--neon-green);
            line-height: 1;
        }

        .pb-rank {
            font-family: 'Orbitron', sans-serif;
            font-size: 2.4rem;
            font-weight: 900;
            color: var(--neon-gold);
            line-height: 1;
            text-shadow: 0 0 15px var(--gold-glow);
        }

        .pb-stats {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 8px;
            margin-top: 8px;
        }

        .stat-chip {
            background: #090f18;
            border: 1px solid var(--border);
            border-radius: 4px;
            padding: 6px 10px;
            font-size: 0.72rem;
            color: #8fa0b5;
        }
        .stat-chip span { color: var(--cyan-core); font-weight: bold; }
    </style>
</head>
<body>

    <div class="id-dossier">
        <div class="header">
            <span class="agency">NEURONSTRIKE // OPERATOR ID</span>
            <span style="font-size: 0.68rem; color: var(--neon-green);">● ACTIVE STATUS</span>
        </div>

        <!-- 幹員資訊 -->
        <div class="operator-hero">
            <img class="avatar" id="avatarImg" src="https://static.line-scdn.net/line_client/img/default_profile.png" alt="Avatar">
            <div class="op-meta">
                <div class="lbl">CALLSIGN // 代號</div>
                <div class="name" id="dispName">IDENTIFYING...</div>
                <div class="lbl" style="margin-top: 4px;">OPERATOR REF</div>
                <div class="uid" id="dispUid">--</div>
            </div>
        </div>

        <!-- 現場報到條碼 (櫃台掃碼帶入大螢幕) -->
        <div class="checkin-section">
            <div class="checkin-title">SCAN TO DEPLOY // 現場開局掃描碼</div>
            <div class="qr-box" id="qrcodeBox"></div>
            <div class="checkin-hint">入場時向店內櫃台出示，自動帶入開局姓名</div>
        </div>

        <!-- 個人歷史最佳戰績 (Personal Best) -->
        <div class="pb-section">
            <div class="pb-header">
                <span class="pb-title">🏆 ALL-TIME BEST // 個人生涯巔峰</span>
                <span style="font-size: 0.68rem; color: var(--text-dim);" id="matchCount">MATCHES: 0</span>
            </div>
            <div class="pb-hero">
                <div>
                    <div style="font-size: 0.65rem; color: var(--text-dim);">BEST CLEAR TIME</div>
                    <div class="pb-time" id="bestTime">--</div>
                </div>
                <div style="text-align: center;">
                    <div style="font-size: 0.65rem; color: var(--text-dim);">GRADE</div>
                    <div class="pb-rank" id="bestRank">-</div>
                </div>
            </div>
            <div class="pb-stats">
                <div class="stat-chip">ALPHA HITS: <span id="statAlpha">-</span></div>
                <div class="stat-chip">LAST RECORD: <span id="statDate">--</span></div>
            </div>
        </div>
    </div>

    <script>
        const LIFF_ID = "2011351699-1AubGp3r"; // 你的 LIFF ID
        const FIREBASE_BASE = "https://nst-killhouse-default-rtdb.firebaseio.com/leaderboard";

        async function initOperatorId() {
            try {
                await liff.init({ liffId: LIFF_ID });
                if (liff.isLoggedIn()) {
                    const profile = await liff.getProfile();
                    
                    document.getElementById("dispName").innerText = profile.displayName;
                    document.getElementById("dispUid").innerText = profile.userId.substring(0, 16) + "...";
                    if (profile.pictureUrl) {
                        document.getElementById("avatarImg").src = profile.pictureUrl;
                    }

                    // 生成報到 QR Code (內容直接帶射手名字，掃碼槍刷一下直接送進大螢幕)
                    const qrBox = document.getElementById("qrcodeBox");
                    qrBox.innerHTML = "";
                    new QRCode(qrBox, {
                        text: profile.displayName,
                        width: 120,
                        height: 120
                    });

                    // 撈取此射手的個人歷史成績
                    fetchPersonalPB(profile.displayName);
                } else {
                    liff.login();
                }
            } catch (err) {
                console.warn("LIFF 載入失敗:", err);
            }
        }

        async function fetchPersonalPB(operatorName) {
            try {
                let res = await fetch(`${FIREBASE_BASE}.json`);
                let rootData = await res.json();
                if (!rootData) return;

                let myRecords = [];
                Object.keys(rootData).forEach(season => {
                    let sData = rootData[season];
                    if (typeof sData === "object" && sData !== null) {
                        Object.values(sData).forEach(r => {
                            if (r.name && r.name.trim() === operatorName.trim()) {
                                myRecords.push(r);
                            }
                        });
                    }
                });

                if (myRecords.length === 0) {
                    document.getElementById("bestTime").innerText = "NONE";
                    return;
                }

                // 依秒數排序，第 0 筆就是個人最速紀錄 (PB)
                myRecords.sort((a, b) => Number(a.score) - Number(b.score));
                const pb = myRecords[0];

                document.getElementById("bestTime").innerText = `${Number(pb.score).toFixed(2)}s`;
                document.getElementById("bestRank").innerText = pb.score < 3.5 ? "S" : (pb.score < 4.5 ? "A" : "B");
                document.getElementById("statAlpha").innerText = `x${pb.alpha || 0}`;
                document.getElementById("matchCount").innerText = `TOTAL RUNS: ${myRecords.length}`;
                
                if (pb.timestamp) {
                    const d = new Date(pb.timestamp);
                    document.getElementById("statDate").innerText = `${d.getMonth()+1}/${d.getDate()}`;
                }
            } catch (e) {
                console.error("PB 查詢失敗:", e);
            }
        }

        window.onload = initOperatorId;
    </script>
</body>
</html>
