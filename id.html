<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>OPERATOR ID // TACTICAL PASS</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:ital,wght@0,600;0,700;1,700&family=Orbitron:wght@700;900&family=Share+Tech+Mono&display=swap" rel="stylesheet">
    
    <!-- LINE LIFF SDK 官方 CDN 與 QRCode 函式庫 -->
    <script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>

    <style>
        :root {
            --bg-deep: #03060a;
            --card-bg: rgba(9, 15, 24, 0.95);
            --cyan-core: #00f0ff;
            --cyan-glow: rgba(0, 240, 255, 0.35);
            --neon-green: #00ff66;
            --neon-gold: #ffb700;
            --gold-glow: rgba(255, 183, 0, 0.45);
            --text-dim: #5c7796;
            --border: #142234;
            --border-bright: #1d334e;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }

        body {
            background-color: var(--bg-deep);
            color: #fff;
            font-family: 'Share Tech Mono', monospace;
            padding: 14px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            /* 純淨科技微網格底，無任何 CRT 橫紋掃描線或雜訊濾鏡 */
            background-image: 
                linear-gradient(rgba(0, 240, 255, 0.02) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 240, 255, 0.02) 1px, transparent 1px);
            background-size: 24px 24px;
        }

        .id-dossier {
            width: 100%;
            max-width: 380px;
            background: var(--card-bg);
            border: 1px solid var(--border-bright);
            border-radius: 8px;
            padding: 20px;
            box-shadow: 0 10px 35px rgba(0, 0, 0, 0.8), 0 0 20px rgba(0, 240, 255, 0.1);
            position: relative;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border);
            padding-bottom: 10px;
            margin-bottom: 16px;
        }

        .header .agency {
            font-family: 'Orbitron', sans-serif;
            font-size: 0.85rem;
            color: var(--cyan-core);
            letter-spacing: 2px;
            font-weight: bold;
        }

        .operator-hero {
            display: flex;
            gap: 15px;
            align-items: center;
            margin-bottom: 18px;
        }

        .avatar {
            width: 68px;
            height: 68px;
            border-radius: 6px;
            border: 1.5px solid var(--cyan-core);
            object-fit: cover;
            background: #080e16;
            box-shadow: 0 0 10px var(--cyan-glow);
        }

        .op-meta .lbl {
            font-size: 0.65rem;
            color: var(--text-dim);
            letter-spacing: 1px;
        }

        .op-meta .name {
            font-family: 'Chakra Petch', sans-serif;
            font-weight: 700;
            font-size: 1.2rem;
            color: #fff;
            margin: 2px 0 4px 0;
            letter-spacing: 0.5px;
        }

        .op-meta .uid {
            font-size: 0.68rem;
            color: var(--cyan-core);
            word-break: break-all;
        }

        /* 現場報到條碼區 */
        .checkin-section {
            background: rgba(0, 240, 255, 0.03);
            border: 1px dashed var(--border-bright);
            border-radius: 6px;
            padding: 14px;
            text-align: center;
            margin-bottom: 16px;
        }

        .checkin-title {
            font-family: 'Chakra Petch', sans-serif;
            font-size: 0.75rem;
            letter-spacing: 1.5px;
            color: var(--cyan-core);
            font-weight: bold;
            margin-bottom: 10px;
        }

        .qr-box {
            display: inline-flex;
            justify-content: center;
            align-items: center;
            width: 130px;
            height: 130px;
            padding: 6px;
            background: #ffffff;
            border-radius: 4px;
            margin: 0 auto;
            box-shadow: 0 0 15px rgba(0, 0, 0, 0.5);
        }

        .qr-box img {
            display: block;
            max-width: 100%;
            height: auto;
        }

        .checkin-hint {
            font-size: 0.68rem;
            color: var(--text-dim);
            margin-top: 8px;
        }

        /* 生涯最佳戰績 */
        .pb-section {
            border-top: 1px solid var(--border);
            padding-top: 14px;
        }

        .pb-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }

        .pb-title {
            font-family: 'Chakra Petch', sans-serif;
            font-size: 0.78rem;
            letter-spacing: 1px;
            color: var(--neon-gold);
            font-weight: 700;
        }

        .pb-hero {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #060b12;
            border: 1px solid var(--border);
            border-radius: 6px;
            padding: 10px 14px;
        }

        .pb-time {
            font-family: 'Orbitron', monospace;
            font-size: 2rem;
            font-weight: 900;
            color: var(--cyan-core);
            line-height: 1;
        }

        .pb-rank {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.6rem;
            font-weight: 900;
            color: var(--neon-gold);
            line-height: 1;
            text-shadow: 0 0 10px var(--gold-glow);
        }

        .pb-stats {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 6px;
            margin-top: 8px;
        }

        .stat-chip {
            background: #060b12;
            border: 1px solid var(--border);
            border-radius: 4px;
            padding: 6px 10px;
            font-size: 0.7rem;
            color: var(--text-dim);
        }
        .stat-chip span { color: #fff; font-weight: bold; }
    </style>
</head>
<body>

    <div class="id-dossier">
        <div class="header">
            <span class="agency">NEURONSTRIKE // OPERATOR ID</span>
            <span style="font-size: 0.68rem; color: var(--neon-green);">● ACTIVE</span>
        </div>

        <div class="operator-hero">
            <img class="avatar" id="avatarImg" src="https://static.line-scdn.net/line_client/img/default_profile.png" alt="Avatar">
            <div class="op-meta">
                <div class="lbl">CALLSIGN // 射手代號</div>
                <div class="name" id="dispName">IDENTIFYING...</div>
                <div class="lbl" style="margin-top: 4px;">OPERATOR REF</div>
                <div class="uid" id="dispUid">--</div>
            </div>
        </div>

        <div class="checkin-section">
            <div class="checkin-title">SCAN TO DEPLOY // 現場開局掃描碼</div>
            <div class="qr-box" id="qrcodeBox"></div>
            <div class="checkin-hint">於 POS 或報到台出示，自動帶入射手身分</div>
        </div>

        <div class="pb-section">
            <div class="pb-header">
                <span class="pb-title">⚡ KILLINGLANE BEST // 20M 生涯最佳</span>
                <span style="font-size: 0.68rem; color: var(--text-dim);" id="matchCount">MATCHES: 0</span>
            </div>
            <div class="pb-hero">
                <div>
                    <div style="font-size: 0.65rem; color: var(--text-dim);">BEST CLEAR TIME</div>
                    <div class="pb-time" id="bestTime">--</div>
                </div>
                <div style="text-align: right;">
                    <div style="font-size: 0.65rem; color: var(--text-dim);">STATUS</div>
                    <div class="pb-rank" id="bestRank">STANDBY</div>
                </div>
            </div>
            <div class="pb-stats">
                <div class="stat-chip">實跑用時: <span id="statRaw">--</span></div>
                <div class="stat-chip">最近挑戰: <span id="statDate">--</span></div>
            </div>
        </div>
    </div>

    <script>
        const LIFF_ID = "2011351699-ICoDeO6U"; 
        const FIREBASE_KL_ENDPOINT = "https://nst-killhouse-default-rtdb.firebaseio.com/GhostSteel/Leaderboard/killinglane.json";

        function drawCheckinQR(textData) {
            const box = document.getElementById("qrcodeBox");
            if (!box) return;
            box.innerHTML = "";

            if (typeof QRCode !== "undefined") {
                try {
                    new QRCode(box, {
                        text: textData,
                        width: 118,
                        height: 118,
                        colorDark: "#000000",
                        colorLight: "#ffffff",
                        correctLevel: QRCode.CorrectLevel.M
                    });
                    return;
                } catch (e) {}
            }

            const img = document.createElement("img");
            img.src = `https://api.qrserver.com/v1/create-qr-code/?size=118x118&data=${encodeURIComponent(textData)}`;
            img.style.width = "118px";
            img.style.height = "118px";
            box.appendChild(img);
        }

        async function initPage() {
            let opName = "OPERATOR_GHOST";
            let opUid = "NST-7701";

            drawCheckinQR(opName);

            try {
                const liffPromise = liff.init({ liffId: LIFF_ID });
                const timeoutPromise = new Promise((_, reject) => setTimeout(() => reject("TIMEOUT"), 2500));
                await Promise.race([liffPromise, timeoutPromise]);

                if (liff.isLoggedIn()) {
                    const profile = await liff.getProfile();
                    opName = profile.displayName || "OPERATOR_VIP";
                    opUid = profile.userId ? (profile.userId.substring(0, 14) + "...") : "ID_SECURED";

                    if (profile.pictureUrl) {
                        document.getElementById("avatarImg").src = profile.pictureUrl;
                    }
                } else {
                    opName = "GUEST_OPERATOR";
                    opUid = "OFFLINE_GUEST";
                }
            } catch (err) {
                opName = "Operator_" + Math.floor(Math.random() * 899 + 100);
                opUid = "STANDBY_MODE";
            }

            document.getElementById("dispName").innerText = opName.toUpperCase();
            document.getElementById("dispUid").innerText = opUid;
            drawCheckinQR(opName);

            fetchKillingLanePB(opName);
        }

        async function fetchKillingLanePB(name) {
            try {
                let res = await fetch(FIREBASE_KL_ENDPOINT);
                let data = await res.json();
                if (!data) {
                    document.getElementById("bestTime").innerText = "--";
                    return;
                }

                let matches = [];
                Object.values(data).forEach(r => {
                    if (r.operator && r.operator.trim().toLowerCase() === name.trim().toLowerCase()) {
                        matches.push(r);
                    }
                });

                if (matches.length > 0) {
                    matches.sort((a, b) => Number(a.final_time || a.time) - Number(b.final_time || b.time));
                    const best = matches[0];
                    const finalSec = Number(best.final_time || best.time).toFixed(2);
                    const rawSec = Number(best.raw_time || best.time).toFixed(2);

                    document.getElementById("bestTime").innerText = `${finalSec}s`;
                    document.getElementById("bestRank").innerText = "WIPEOUT";
                    document.getElementById("statRaw").innerText = `${rawSec}s`;
                    document.getElementById("matchCount").innerText = `MATCHES: ${matches.length}`;
                    if (best.timestamp) {
                        const d = new Date(best.timestamp);
                        document.getElementById("statDate").innerText = `${d.getMonth()+1}/${d.getDate()}`;
                    }
                } else {
                    document.getElementById("bestTime").innerText = "--";
                    document.getElementById("bestRank").innerText = "UNRANKED";
                }
            } catch (e) {
                document.getElementById("bestTime").innerText = "--";
            }
        }

        window.onload = initPage;
    </script>
</body>
</html>
