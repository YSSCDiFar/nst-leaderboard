<!-- 替換 head 裡的 qrcode 引用為更穩定的 CDN -->
    <script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
    <script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>

    <script>
        // ─── [設定區] ───
        // 1. 請填入你的真實 LIFF ID
        const LIFF_ID = "2011351699-1AubGp3r"; 
        // 2. Firebase 基礎路徑
        const FIREBASE_BASE = "https://nst-killhouse-default-rtdb.firebaseio.com/leaderboard";

        async function initOperatorId() {
            let operatorName = "OPERATOR_GHOST";

            try {
                // 1. 初始化 LIFF
                await liff.init({ liffId: LIFF_ID });

                if (liff.isLoggedIn()) {
                    const profile = await liff.getProfile();
                    operatorName = profile.displayName || "GUEST_OPERATOR";
                    
                    document.getElementById("dispName").innerText = operatorName;
                    document.getElementById("dispUid").innerText = profile.userId ? (profile.userId.substring(0, 16) + "...") : "ID_UNKNOWN";
                    if (profile.pictureUrl) {
                        document.getElementById("avatarImg").src = profile.pictureUrl;
                    }
                } else {
                    // 若在 LINE 外開啟，可直接啟動登入，或先以訪客身分展示
                    console.warn("[LIFF] 尚未登入，啟用訪客展示模式");
                    document.getElementById("dispName").innerText = "GUEST_OPERATOR";
                    document.getElementById("dispUid").innerText = "OFFLINE_MODE";
                }
            } catch (err) {
                console.warn("[LIFF] 初始化失敗，降級為離線卡片:", err);
                document.getElementById("dispName").innerText = "GUEST_OPERATOR";
            }

            // 2. 無論 LIFF 有無報錯，強制渲染報到 QR Code (雙引擎防護)
            renderCheckinQR(operatorName);

            // 3. 查詢歷史 PB
            fetchPersonalPB(operatorName);
        }

        // 雙引擎 QR Code 生成邏輯
        function renderCheckinQR(content) {
            const qrBox = document.getElementById("qrcodeBox");
            if (!qrBox) return;
            qrBox.innerHTML = "";

            // 方案 A：本地 JS 庫繪製
            if (typeof QRCode !== "undefined") {
                try {
                    new QRCode(qrBox, {
                        text: content,
                        width: 120,
                        height: 120,
                        correctLevel: QRCode.CorrectLevel.M
                    });
                    return;
                } catch (e) {
                    console.warn("[QR] JS 生成失敗，切換雲端備用引擎:", e);
                }
            }

            // 方案 B：雲端圖片生成 (100% 絕對成功)
            const fallbackImg = document.createElement("img");
            fallbackImg.src = `https://api.qrserver.com/v1/create-qr-code/?size=120x120&data=${encodeURIComponent(content)}`;
            fallbackImg.style.width = "120px";
            fallbackImg.style.height = "120px";
            qrBox.appendChild(fallbackImg);
        }

        async function fetchPersonalPB(operatorName) {
            try {
                let res = await fetch(`${FIREBASE_BASE}.json`);
                let rootData = await res.json();
                if (!rootData) {
                    document.getElementById("bestTime").innerText = "NONE";
                    return;
                }

                let myRecords = [];
                Object.keys(rootData).forEach(season => {
                    let sData = rootData[season];
                    if (typeof sData === "object" && sData !== null) {
                        Object.values(sData).forEach(r => {
                            if (r.name && r.name.trim().toLowerCase() === operatorName.trim().toLowerCase()) {
                                myRecords.push(r);
                            }
                        });
                    }
                });

                if (myRecords.length === 0) {
                    document.getElementById("bestTime").innerText = "NONE";
                    return;
                }

                myRecords.sort((a, b) => Number(a.score) - Number(b.score));
                const pb = myRecords[0];

                document.getElementById("bestTime").innerText = `${Number(pb.score).toFixed(2)}s`;
                document.getElementById("bestRank").innerText = pb.score < 3.5 ? "S" : (pb.score < 4.5 ? "A" : "B");
                document.getElementById("statAlpha").innerText = `x${pb.alpha || 0}`;
                document.getElementById("matchCount").innerText = `TOTAL RUNS: ${myRecords.length}`;
                
                if (pb.timestamp) {
                    const d = new Date(pb.timestamp);
                    document.getElementById("statDate").innerText = `${d.getMonth()+1}/${d.getDate()}`;
                }
            } catch (e) {
                console.error("PB 查詢失敗:", e);
            }
        }

        window.onload = initOperatorId;
    </script>
